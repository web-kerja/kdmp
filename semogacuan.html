<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keuangan - Semoga Cuan</title>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#fff7ed;color:#222}
.hdr{background:#c00;color:#fff;padding:16px}.hdr h1{margin:0;font-size:30px}.hdr small{opacity:.9}
.tabs{display:flex;gap:8px;padding:10px;overflow:auto}.tab{border:0;background:#fff;padding:10px 14px;border-radius:14px;white-space:nowrap}.tab.on{background:#c00;color:#fff}
.card{background:#fff;margin:10px;padding:14px;border-radius:16px;box-shadow:0 2px 8px #0001}
.btn{border:0;padding:10px 14px;border-radius:12px;background:#eee;cursor:pointer}.btnR{background:#c00;color:#fff}.btnG{background:#fee2e2}.btnP{background:#dbeafe}
input,select,textarea{width:100%;padding:10px;margin:5px 0;border:1px solid #ddd;border-radius:10px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.pill{padding:6px 10px;border-radius:20px;background:#fee2e2;font-size:12px}
.fab{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border-radius:50%;background:#c00;color:#fff;font-size:32px;border:0}
.debug{font-size:12px;opacity:.9;background:#0003;padding:6px;border-radius:8px;margin-top:8px}
</style></head>
<body>
<div class="hdr">
<div class="row"><button class="btn" onclick="showAcc()">👤 <span id="accName">Akun</span></button><span id="syncSt">⏳ Siap</span></div>
<h1 id="saldoTop">Rp 0</h1><div><span id="totIn">Masuk 0</span> &nbsp; <span id="totOut">Keluar 0</span> &nbsp; <span id="totWal"></span></div>
<div class="debug" id="dbg">DEBUG: mulai...</div>
<div id="accBox" style="display:none;background:#fff;color:#222;padding:10px;border-radius:10px;margin-top:10px">
<div id="accList"></div><input id="newAcc" placeholder="Nama akun baru, misal Dana Rumah Kayu"><button class="btn btnR" onclick="createAcc()">+ Buat Akun Baru</button>
</div></div>

<div class="tabs">
<button class="tab on" onclick="showTab('keu',this)">💰 Keuangan</button>
<button class="tab" onclick="showTab('hutang',this)">Hutang</button>
<button class="tab" onclick="showTab('tagihan',this)">Tagihan</button>
<button class="tab" onclick="showTab('budget',this)">Budget</button>
<button class="tab" onclick="showTab('nabung',this)">Nabung</button>
<button class="tab" onclick="showTab('bagi',this)">Bagi</button>
</div>

<div id="tab-keu">
<div class="card"><div class="row"><b>💳 Dompet</b><span><button class="btn" onclick="openPindah()">🔁 Pindah</button> <button class="btn" onclick="addWallet()">+ Tambah</button></span></div>
<div id="walletList"></div><button class="btn btnG" onclick="auditSelisih()">🔍 Cek Kenapa Selisih</button></div>
<div class="card"><b>🏷️ Kategori</b><div class="row"><button class="btn" onclick="setCatType('keluar')">Pengeluaran</button><button class="btn" onclick="setCatType('masuk')">Pemasukan</button><button class="btn btnR" onclick="addCat()">+ Kategori</button></div><div id="catList"></div></div>
<div class="card"><b>📋 Transaksi 100 Terakhir</b><div id="txList"></div></div>
</div>

<div id="tab-hutang" style="display:none"><div class="card"><b>Hutang / Piutang</b><input id="hNama" placeholder="Nama"><input id="hAmt" type="number" placeholder="Nominal"><select id="hType"><option value="hutang">Saya Berhutang</option><option value="piutang">Orang Berhutang ke Saya</option></select><button class="btn btnR" onclick="addHutang()">+ Tambah</button><div id="hutangList"></div></div></div>

<div id="tab-tagihan" style="display:none"><div class="card"><b>Tagihan Rutin</b><input id="tNama" placeholder="Nama, misal BPJS"><input id="tAmt" type="number" placeholder="Nominal"><button class="btn btnR" onclick="addTagihan()">+ Tambah</button><div id="tagihanList"></div></div></div>

<div id="tab-budget" style="display:none"><div class="card"><b>Budget</b><input id="bCat" placeholder="Kategori"><input id="bAmt" type="number" placeholder="Limit"><button class="btn btnR" onclick="addBudget()">+ Tambah</button><div id="budgetList"></div></div></div>

<div id="tab-nabung" style="display:none"><div class="card"><b>Nabung / Target</b><input id="nNama" placeholder="Nama target"><input id="nAmt" type="number" placeholder="Target"><button class="btn btnR" onclick="addNabung()">+ Tambah</button><div id="nabungList"></div></div></div>

<div id="tab-bagi" style="display:none"><div class="card"><b>Bagi Uang</b><input id="bgAmt" type="number" placeholder="Nominal yang mau dibagi"><button class="btn btnR" onclick="bagiUang()">Bagi</button><div id="bagiList"></div></div></div>

<div id="formBox" style="display:none" class="card">
<b id="formTitle">Tambah Transaksi</b>
<select id="fType" onchange="onType()"><option value="keluar">Keluar</option><option value="masuk">Masuk</option><option value="pindah">Pindah Dompet</option><option value="nabung">Nabung (link)</option><option value="hutang">Bayar Hutang (link)</option><option value="tagihan">Bayar Tagihan (link)</option></select>
<select id="fCat"></select>
<input id="fAmt" type="number" placeholder="Nominal">
<select id="fWallet"></select>
<select id="fWallet2" style="display:none"></select>
<select id="fLink" style="display:none"></select>
<input id="fNote" placeholder="Catatan (opsional)">
<button class="btn btnR" onclick="saveTx()">Simpan</button> <button class="btn" onclick="closeForm()">Batal</button>
</div>

<button class="fab" onclick="openForm()">+</button>
<script>
var $=function(id){return document.getElementById(id)};
function fmt(n){return 'Rp '+(Number(n)||0).toLocaleString('id-ID')};
function setDbg(t){$('dbg').textContent='DEBUG: '+t};
function setSync(ok,t){$('syncSt').textContent=(ok?'🟢 ':'🟡 ')+(t||'Siap')};

// ==== FIREBASE CONFIG - GANTI PUNYA MAS ====
var firebaseConfig = {apiKey:"GANTI_CONFIG_FIREBASE_MAS_DISINI",authDomain:"",projectId:"",storageBucket:"",messagingSenderId:"",appId:""};
// Kalau Mas sudah punya config lama, timpa objek di atas dengan config lama itu.
// ============================================

var uid=null,db=null;
try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();}catch(e){setDbg('firebase config belum diisi, mode lokal');}

var accs=JSON.parse(localStorage.getItem('accs')||'[]');
if(accs.length==0){accs=[{id:'room_1',name:'Akun Saya'}];}
var curAcc=localStorage.getItem('curAcc')||accs[0].id;
var room=curAcc;
var txs=[],wallets=[{name:'Cash'}],cats=[{name:'Makan',type:'keluar'},{name:'Transport',type:'keluar'},{name:'Jajan',type:'keluar'},{name:'Gaji',type:'masuk'},{name:'Jualan',type:'masuk'}],hutangs=[],tagihans=[],budgets=[],nabungs=[],bagiSaved=[];
var catType='keluar';
function roomRef(){return db.collection('rooms').doc(room)};
function txRef(){return roomRef().collection('tx')};
function saveAccs(){localStorage.setItem('accs',JSON.stringify(accs));localStorage.setItem('curAcc',curAcc)};
function showAcc(){var b=$('accBox');b.style.display=b.style.display=='none'?'block':'none';renderAcc()};
function renderAcc(){var h='';accs.forEach(function(a){h+='<div class="row"><b>'+a.name+(a.id==curAcc?' 🟢':'')+'</b><button class="btn" onclick="switchAcc(\''+a.id+'\')">Pindah</button></div>'});$('accList').innerHTML=h;$('accName').textContent=(accs.find(function(a){return a.id==curAcc})||{}).name||'Akun'};

// FIX UTAMA: kosongin layar dulu sebelum pindah kamar
function clearAllData(){
  txs=[];wallets=[{name:'Cash'}];hutangs=[];tagihans=[];budgets=[];nabungs=[];cats=[{name:'Makan',type:'keluar'},{name:'Transport',type:'keluar'},{name:'Jajan',type:'keluar'},{name:'Gaji',type:'masuk'},{name:'Jualan',type:'masuk'}];bagiSaved=[];
}
function switchAcc(id){
  if(id==room) return;
  clearAllData();curAcc=id;room=id;saveAccs();setSync(false,'Ganti kamar...');render();renderCats();renderHutang();renderTagihan();renderBudget();renderNabung();renderAcc();
  if(uid) syncFirebase(); else loadLocal();
}
function createAcc(){
  var n=$('newAcc').value.trim();if(!n) return alert('Isi nama dulu');
  clearAllData();var id='room_'+Date.now();accs.push({id:id,name:n});curAcc=id;room=id;saveAccs();$('newAcc').value='';renderAcc();render();renderCats();renderHutang();renderTagihan();renderBudget();renderNabung();
  if(uid) syncFirebase(); else saveLocal();
  alert('Akun baru "'+n+'" dibuat, masih KOSONG Rp 0.');
}
function showTab(name,el){document.querySelectorAll('.tab').forEach(function(t){t.classList.remove('on')});if(el)el.classList.add('on');['keu','hutang','tagihan','budget','nabung','bagi'].forEach(function(k){$('tab-'+k).style.display=(k==name?'block':'none')})};
function setCatType(t){catType=t;renderCats()};
function render(){
  var totIn=0,totOut=0;txs.forEach(function(t){if(t.type=='masuk')totIn+=Number(t.amount)||0;else if(t.type=='pindah'){}else totOut+=Number(t.amount)||0});
  $('saldoTop').textContent=fmt(totIn-totOut);$('totIn').textContent='Masuk '+fmt(totIn);$('totOut').textContent='Keluar '+fmt(totOut);
  var h='';txs.slice(0,100).forEach(function(t){
    var label=t.type=='pindah'?'Pindah ke '+(t.wallet2||''):t.cat;
    h+='<div class="row" style="border-bottom:1px solid #eee;padding:8px 0"><span><b>'+label+'</b><br><small>'+(t.wallet||'')+(t.type=='pindah'?' → '+(t.wallet2||''):'')+' • '+(t.t?new Date(t.t).toLocaleDateString('id-ID'):'')+'</small></span><span style="color:'+(t.type=='masuk'?'green':'red')+'">'+(t.type=='masuk'?'+':'-')+fmt(t.amount)+'</span></div>';
  });
  $('txList').innerHTML=h||'Belum ada transaksi';renderW();
}
function renderW(){
  var h='';wallets.forEach(function(w){
    var tot=0;txs.forEach(function(t){
      if(t.wallet==w.name){if(t.type=='masuk')tot+=Number(t.amount)||0;else if(t.type=='pindah')tot-=Number(t.amount)||0;else tot-=Number(t.amount)||0}
      if(t.type=='pindah'&&t.wallet2==w.name)tot+=Number(t.amount)||0;
    });
    h+='<div class="row" style="padding:8px 0;border-bottom:1px solid #eee"><b>'+w.name+'</b><b>'+fmt(tot)+'</b></div>';
  });
  $('walletList').innerHTML=h||'Cash Rp 0';
  var sum=0;wallets.forEach(function(w){var tot=0;txs.forEach(function(t){if(t.wallet==w.name){if(t.type=='masuk')tot+=Number(t.amount)||0;else tot-=Number(t.amount)||0}if(t.type=='pindah'&&t.wallet2==w.name)tot+=Number(t.amount)||0});sum+=tot});
  var totIn=0,totOut=0;txs.forEach(function(t){if(t.type=='masuk')totIn+=Number(t.amount)||0;else if(t.type=='pindah'){}else totOut+=Number(t.amount)||0});
  $('totWal').textContent='• Dompet '+fmt(sum);
}
function renderCats(){
  var h='';cats.filter(function(c){return c.type==catType}).forEach(function(c){h+='<span class="pill">'+c.name+'</span> '});
  $('catList').innerHTML=h||'Belum ada kategori';
  var f=$('fCat');if(f){f.innerHTML='';cats.forEach(function(c){var o=document.createElement('option');o.value=c.name;o.textContent=c.name+' ('+c.type+')';f.appendChild(o)})}
  var w=$('fWallet'),w2=$('fWallet2');if(w){w.innerHTML='';wallets.forEach(function(x){var o=document.createElement('option');o.value=x.name;o.textContent=x.name;w.appendChild(o)})}
  if(w2){w2.innerHTML='';wallets.forEach(function(x){var o=document.createElement('option');o.value=x.name;o.textContent=x.name;w2.appendChild(o)})}
}
function addWallet(){var n=prompt('Nama dompet baru:');if(!n)return;wallets.push({name:n});if(uid)roomRef().collection('wallets').add({name:n});saveLocal();renderW();renderCats()};
function addCat(){var n=prompt('Nama kategori:');if(!n)return;cats.push({name:n,type:catType});if(uid)roomRef().collection('cats').add({name:n,type:catType});saveLocal();renderCats()};
function auditSelisih(){
  var totIn=0,totOut=0;txs.forEach(function(t){if(t.type=='masuk')totIn+=Number(t.amount)||0;else if(t.type=='pindah'){}else totOut+=Number(t.amount)||0});
  var bal=totIn-totOut;var sum=0;wallets.forEach(function(w){var tot=0;txs.forEach(function(t){if(t.wallet==w.name){if(t.type=='masuk')tot+=Number(t.amount)||0;else tot-=Number(t.amount)||0}if(t.type=='pindah'&&t.wallet2==w.name)tot+=Number(t.amount)||0});sum+=tot});
  alert('Saldo atas: '+fmt(bal)+'\nTotal dompet: '+fmt(sum)+'\nSelisih: '+fmt(Math.abs(bal-sum))+(bal==sum?'\n\nSudah SAMA ✅':'\n\nMasih selisih, cek transaksi Pindah yang masih tercatat sebagai Keluar.'));
}
function openForm(){$('formBox').style.display='block';renderCats();onType()};
function closeForm(){$('formBox').style.display='none'};
function openPindah(){$('fType').value='pindah';openForm()};
function onType(){
  var t=$('fType').value;$('fWallet2').style.display=(t=='pindah'?'block':'none');$('fLink').style.display=(t=='nabung'||t=='hutang'||t=='tagihan'?'block':'none');
  var lk=$('fLink');lk.innerHTML='';
  if(t=='nabung')nabungs.forEach(function(x){var o=document.createElement('option');o.value='nabung:'+x.id;o.textContent=x.name;lk.appendChild(o)});
  if(t=='hutang')hutangs.forEach(function(x){var o=document.createElement('option');o.value='hutang:'+x.id;o.textContent=x.name;lk.appendChild(o)});
  if(t=='tagihan')tagihans.forEach(function(x){var o=document.createElement('option');o.value='tagihan:'+x.id;o.textContent=x.name;lk.appendChild(o)});
}
function saveTx(){
  var type=$('fType').value,cat=$('fCat').value,amt=Number($('fAmt').value),wal=$('fWallet').value,wal2=$('fWallet2').value,link=$('fLink').value||'';
  if(!amt) return alert('Isi nominal');
  // FIX: pindah harus punya tujuan beda, nabung/hutang/tagihan tetap dihitung KELUAR
  if(type=='pindah'){if(!wal2||wal2==wal) return alert('Pilih dompet tujuan yang beda');cat='Pindah ke '+wal2}
  if(type=='nabung'||type=='hutang'||type=='tagihan'){type='keluar'}
  var d={cat:cat,amount:amt,wallet:wal,type:type,wallet2:(type=='pindah'?wal2:''),link:link,t:Date.now(),localId:'L'+Date.now()};
  if(uid){txRef().add(d)} else {txs.unshift({...d,id:d.localId});saveLocal()}
  // Kalau bayar tagihan lewat form, tandai tagihannya lunas
  if(link.indexOf('tagihan:')==0){var tid=link.split(':')[1];var tg=tagihans.find(function(x){return String(x.id)==String(tid)});if(tg){tg.status='Terbayar';if(uid)roomRef().collection('tagihan').doc(tid).update({status:'Terbayar'});renderTagihan()}}
  $('fAmt').value='';closeForm();render();
}
function addHutang(){var n=$('hNama').value,a=Number($('hAmt').value),ty=$('hType').value;if(!n||!a)return;var d={name:n,amount:a,type:ty,status:'Belum Lunas',t:Date.now()};if(uid)roomRef().collection('hutang').add(d);else hutangs.unshift({...d,id:'H'+Date.now()});saveLocal();renderHutang()};
function renderHutang(){var h='';hutangs.forEach(function(x){h+='<div class="row"><span><b>'+x.name+'</b> • '+x.type+' • '+x.status+'</span><b>'+fmt(x.amount)+'</b></div>'});$('hutangList').innerHTML=h||'Belum ada hutang'};
function addTagihan(){var n=$('tNama').value,a=Number($('tAmt').value);if(!n||!a)return;var d={name:n,amount:a,status:'Belum Bayar',t:Date.now()};if(uid)roomRef().collection('tagihan').add(d);else tagihans.unshift({...d,id:'T'+Date.now()});saveLocal();renderTagihan()};
function renderTagihan(){var h='';tagihans.forEach(function(x){h+='<div class="row"><span><b>'+x.name+'</b> • '+x.status+'</span><span><b>'+fmt(x.amount)+'</b> <button class="btn btnR" onclick="payTagihan(\''+x.id+'\')">Bayar</button></span></div>'});$('tagihanList').innerHTML=h||'Belum ada tagihan'};
// FIX: Bayar dari Tagihan WAJIB masuk Log sebagai Keluar
function payTagihan(id){
  var t=tagihans.find(function(x){return String(x.id)==String(id)});if(!t)return;
  if(t.status=='Terbayar'&&!confirm(t.name+' sudah Terbayar.\nMau bayar lagi untuk bulan depan?')) return;
  if(t.status!='Terbayar'&&!confirm('Bayar '+t.name+' '+fmt(t.amount)+'?')) return;
  var wal=prompt('Dari dompet:',wallets[0]?wallets[0].name:'Cash');if(!wal)return;
  var d={cat:t.name,amount:Number(t.amount),wallet:wal,type:'keluar',link:'tagihan:'+id,t:Date.now(),localId:'L'+Date.now()};
  if(uid)txRef().add(d);else{txs.unshift({...d,id:d.localId});saveLocal()}
  t.status='Terbayar';if(uid&&!String(id).startsWith('T'))roomRef().collection('tagihan').doc(id).update({status:'Terbayar'});
  saveLocal();renderTagihan();render();alert('Berhasil bayar '+t.name+' '+fmt(t.amount)+' dari '+wal+'\nSudah masuk ke Log Transaksi.');
}
function addBudget(){var c=$('bCat').value,a=Number($('bAmt').value);if(!c||!a)return;var d={cat:c,amount:a,t:Date.now()};if(uid)roomRef().collection('budget').add(d);else budgets.unshift({...d,id:'B'+Date.now()});saveLocal();renderBudget()};
function renderBudget(){var h='';budgets.forEach(function(x){var used=0;txs.forEach(function(t){if(t.cat==x.cat&&t.type!='masuk'&&t.type!='pindah')used+=Number(t.amount)||0});h+='<div class="row"><span><b>'+x.cat+'</b> • Terpakai '+fmt(used)+' / '+fmt(x.amount)+'</span><b>'+fmt(Math.max(0,x.amount-used))+' sisa</b></div>'});$('budgetList').innerHTML=h||'Belum ada budget'};
function addNabung(){var n=$('nNama').value,a=Number($('nAmt').value);if(!n||!a)return;var d={name:n,amount:a,t:Date.now()};if(uid)roomRef().collection('nabung').add(d);else nabungs.unshift({...d,id:'N'+Date.now()});saveLocal();renderNabung()};
function renderNabung(){var h='';nabungs.forEach(function(x){var terkumpul=0;txs.forEach(function(t){if(t.link=='nabung:'+x.id)terkumpul+=Number(t.amount)||0});h+='<div class="row"><span><b>'+x.name+'</b> • Terkumpul '+fmt(terkumpul)+' / '+fmt(x.amount)+'</span></div>'});$('nabungList').innerHTML=h||'Belum ada target'};
function bagiUang(){var amt=Number($('bgAmt').value);if(!amt)return alert('Isi nominal');var per=Math.floor(amt/3);bagiSaved=[{name:'Kebutuhan',amount:per},{name:'Tabungan',amount:per},{name:'Jajan',amount:amt-per*2}];$('bagiList').innerHTML=bagiSaved.map(function(x){return '<div class="row"><b>'+x.name+'</b><b>'+fmt(x.amount)+'</b></div>'}).join('')};

function saveLocal(){try{localStorage.setItem('oldTx',JSON.stringify(txs));localStorage.setItem('localWallets',JSON.stringify(wallets));localStorage.setItem('localCats',JSON.stringify(cats));localStorage.setItem('localHutang',JSON.stringify(hutangs));localStorage.setItem('localTagihan',JSON.stringify(tagihans));localStorage.setItem('localBudget',JSON.stringify(budgets));localStorage.setItem('localNabung',JSON.stringify(nabungs))}catch(e){}};
function loadLocal(){try{txs=JSON.parse(localStorage.getItem('oldTx')||'[]');wallets=JSON.parse(localStorage.getItem('localWallets')||'[{"name":"Cash"}]');cats=JSON.parse(localStorage.getItem('localCats')||'[]');if(cats.length==0)cats=[{name:'Makan',type:'keluar'},{name:'Gaji',type:'masuk'}];hutangs=JSON.parse(localStorage.getItem('localHutang')||'[]');tagihans=JSON.parse(localStorage.getItem('localTagihan')||'[]');budgets=JSON.parse(localStorage.getItem('localBudget')||'[]');nabungs=JSON.parse(localStorage.getItem('localNabung')||'[]')}catch(e){}render();renderCats();renderHutang();renderTagihan();renderBudget();renderNabung()};

function syncFirebase(){if(!db) return;
  // FIX: selalu timpa, walaupun kamar baru kosong
  txRef().orderBy('t','desc').limit(100).onSnapshot(function(s){var arr=[];s.forEach(function(d){arr.push({id:d.id,...d.data()})});txs=arr;setDbg('sync OK tx='+txs.length);setSync(true,'Mode Online');render()});
  roomRef().collection('wallets').onSnapshot(function(s){wallets=[];s.forEach(function(d){wallets.push({id:d.id,...d.data()})});if(wallets.length==0)wallets=[{name:'Cash'}];renderW();renderCats()});
  roomRef().collection('cats').onSnapshot(function(s){cats=[];s.forEach(function(d){cats.push({id:d.id,...d.data()})});if(cats.length==0)cats=[{name:'Makan',type:'keluar'},{name:'Gaji',type:'masuk'}];renderCats()});
  roomRef().collection('hutang').onSnapshot(function(s){hutangs=[];s.forEach(function(d){hutangs.push({id:d.id,...d.data()})});renderHutang()});
  roomRef().collection('tagihan').onSnapshot(function(s){tagihans=[];s.forEach(function(d){tagihans.push({id:d.id,...d.data()})});renderTagihan()});
  roomRef().collection('budget').onSnapshot(function(s){budgets=[];s.forEach(function(d){budgets.push({id:d.id,...d.data()})});renderBudget()});
  roomRef().collection('nabung').onSnapshot(function(s){nabungs=[];s.forEach(function(d){nabungs.push({id:d.id,...d.data()})});renderNabung()});}
setDbg('render awal selesai...');renderAcc();loadLocal();
if(db){firebase.auth().signInAnonymously().then(function(r){uid=r.user.uid;setDbg('login OK');setSync(true,'Mode Online');syncFirebase()}).catch(function(e){setDbg('login gagal: '+e.message+', mode lokal');setSync(false,'Mode Lokal')});} else {setDbg('mode lokal, isi config Firebase');}
</script></body></html>
