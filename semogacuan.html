<script>

var firebaseConfig={apiKey:"AIzaSyA93AVYbEp3ocRCQEtrh0v7_9I5cpJKHiI",authDomain:"catatduit-55060.firebaseapp.com",projectId:"catatduit-55060",storageBucket:"catatduit-55060.firebasestorage.app",messagingSenderId:"1025155283832",appId:"1:1025155283832:web:ee5b46a39942357700e68d"};
if(!firebase.apps.length)firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();var currentAkun=localStorage.getItem('catatduit_akun')||'';var bulanAktif=new Date();var analisisMode='all';var dompets=[],transaksis=[],hutangs=[],tagihans=[],nabungs=[],pembelians=[];var alokasiData={},persenData={tagihan:30,hutang:30,nabung:20,budget:20};var tipe='keluar',lastTanya=null,c1=null,c2=null,cK=null;
function klikPunyaku(){document.getElementById('selId').value='punyaku';document.getElementById('infoAkun').innerText='punyaku';document.getElementById('boxPass').style.display='block';}
function klikKeluarga(){document.getElementById('selId').value='keluarga';document.getElementById('infoAkun').innerText='keluarga';document.getElementById('boxPass').style.display='block';}
function login(){var id=document.getElementById('selId').value;var p=document.getElementById('pass').value;if(id=='punyaku'&&p!='112221'){alert('Pass salah');return;}if(id=='keluarga'&&p!='1234'){alert('Pass salah');return;}localStorage.setItem('catatduit_akun',id);masuk(id);}
function force(){localStorage.setItem('catatduit_akun','punyaku');masuk('punyaku');}

function pindahTab(t){var tabs=['keuangan','hutang','tagihan','budget','nabung','analisis','konsul'];for(var i=0;i<tabs.length;i++){var el=document.getElementById('tab-'+tabs[i]);if(el)el.style.display=(tabs[i]==t?'block':'none');}if(t=='analisis')setTimeout(renderAnalisis,300);if(t=='konsul')setTimeout(renderKonsul,300);}
function setTipe(t){tipe=t;document.getElementById('btKeluar').style.background=(t=='keluar'?'#BE1E2D':'#eee');document.getElementById('btMasuk').style.background=(t=='masuk'?'#16a34a':'#eee');document.getElementById('btPindah').style.background=(t=='pindah'?'#2563eb':'#eee');document.getElementById('tDompet2').style.display=(t=='pindah'?'block':'none');updDom();}
function updDom(){var o='';for(var i=0;i<dompets.length;i++){o+='<option value="'+dompets[i].id+'">'+dompets[i].nama+' - '+dompets[i].saldo+'</option>';}if(o=='')o='<option value="">Buat dompet dulu</option>';document.getElementById('tDompet').innerHTML=o;document.getElementById('tDompet2').innerHTML=o;var cat=['Makan','Jajan','Bensin','Gaji','Bonus'];var co='';for(var j=0;j<cat.length;j++){co+='<option>'+cat[j]+'</option>';}var kc=document.getElementById('tKategori');if(kc)kc.innerHTML=co;updLink();}
function updLink(){var l=document.getElementById('tLink').value;var t=document.getElementById('tLinkTarget');if(l=='none'){t.style.display='none';return;}t.style.display='block';var h='';if(l=='budget'){var k=Object.keys(alokasiData);for(var i=0;i<k.length;i++){h+='<option value="'+k[i]+'">'+k[i]+'</option>';}if(h=='')h='<option value="jajan">jajan</option>';}else if(l=='nabung'){for(var n=0;n<nabungs.length;n++){h+='<option value="'+nabungs[n].id+'">'+nabungs[n].nama+'</option>';}if(h=='')h='<option value="">Belum ada</option>';}else if(l=='hutang'){for(var u=0;u<hutangs.length;u++){h+='<option value="'+hutangs[u].id+'">'+hutangs[u].nama+'</option>';}if(h=='')h='<option value="">Belum ada</option>';}t.innerHTML=h;}

async function sync(){var akun=currentAkun||localStorage.getItem('catatduit_akun')||'punyaku';document.getElementById('syncInfo').innerText='⏳ '+akun;document.getElementById('debug').innerText='Sync '+akun+'...';try{var sd=await db.collection('dompets').get();dompets=[];sd.forEach(function(d){var da=d.data();if(da.akun==akun)dompets.push({id:d.id,...da});});var st=await db.collection('transaksis').orderBy('created','desc').limit(100).get();transaksis=[];st.forEach(function(d){var da=d.data();if(da.akun==akun)transaksis.push({id:d.id,...da});});var sh=await db.collection('hutangs').get();hutangs=[];sh.forEach(function(d){var da=d.data();if(da.akun==akun)hutangs.push({id:d.id,...da});});var stg=await db.collection('tagihans').get();tagihans=[];stg.forEach(function(d){var da=d.data();if(da.akun==akun)tagihans.push({id:d.id,...da});});var sn=await db.collection('nabungs').get();nabungs=[];sn.forEach(function(d){var da=d.data();if(da.akun==akun)nabungs.push({id:d.id,...da});});var sb=await db.collection('pembelians').get();pembelians=[];sb.forEach(function(d){var da=d.data();if(da.akun==akun)pembelians.push({id:d.id,...da});});document.getElementById('syncInfo').innerText='✅ '+dompets.length+'/'+transaksis.length;document.getElementById('debug').innerText='✅ v30.3 OK '+akun+' Dompet:'+dompets.length+' Trx:'+transaksis.length;renderAll();}catch(e){document.getElementById('syncInfo').innerText='❌ Gagal';document.getElementById('debug').innerText='❌ '+e.message;}}
async function saveDompet(){var nama=document.getElementById('dNama').value.trim();var saldo=Number(document.getElementById('dSaldo').value)||0;if(!nama){alert('Isi nama');return;}var akun=currentAkun||'punyaku';await db.collection('dompets').add({nama:nama,saldo:saldo,akun:akun,created:Date.now()});closeM('mDompet');document.getElementById('dNama').value='';document.getElementById('dSaldo').value='';sync();}
async function saveTrx(){var jml=Number(document.getElementById('tJml').value)||0;var dom=document.getElementById('tDompet').value;var dom2=document.getElementById('tDompet2').value;if(!jml||!dom){alert('Isi jumlah & dompet');return;}var akun=currentAkun||'punyaku';var kat=document.getElementById('tKategori').value;var cat=document.getElementById('tCat').value;var tgl=document.getElementById('tTgl').value||new Date().toISOString().slice(0,10);var link=document.getElementById('tLink').value;var linkT=document.getElementById('tLinkTarget').value;try{var dRef=db.collection('dompets').doc(dom);var dSnap=await dRef.get();var dData=dSnap.data();if(tipe=='keluar')await dRef.update({saldo:Number(dData.saldo||0)-jml});if(tipe=='masuk')await dRef.update({saldo:Number(dData.saldo||0)+jml});if(tipe=='pindah'&&dom2){var d2Ref=db.collection('dompets').doc(dom2);var d2Snap=await d2Ref.get();var d2Data=d2Snap.data();await dRef.update({saldo:Number(dData.saldo||0)-jml});await d2Ref.update({saldo:Number(d2Data.saldo||0)+jml});}if(link=='nabung'&&linkT){var nRef=db.collection('nabungs').doc(linkT);var nS=await nRef.get();if(nS.exists)await nRef.update({terkumpul:Number(nS.data().terkumpul||0)+jml});}if(link=='hutang'&&linkT){var hRef=db.collection('hutangs').doc(linkT);var hS=await hRef.get();if(hS.exists)await hRef.update({total:Math.max(0,Number(hS.data().total||0)-jml)});}if(link=='budget'&&linkT){alokasiData[linkT]=Math.max(0,Number(alokasiData[linkT]||0)-jml);localStorage.setItem('alokasi_'+akun,JSON.stringify(alokasiData));}await db.collection('transaksis').add({jml:jml,tipe:tipe,dompetId:dom,kategori:kat,catatan:cat,tgl:tgl,akun:akun,link:link,linkTarget:linkT,created:Date.now()});closeM('mTrx');sync();}catch(e){alert('Gagal: '+e.message);}}
async function saveHutang(){var n=document.getElementById('hNama').value.trim();var t=Number(document.getElementById('hTotal').value)||0;if(!n||!t){alert('Isi nama & total');return;}await db.collection('hutangs').add({nama:n,total:t,cicilan:Number(document.getElementById('hCicilan').value)||0,akun:currentAkun||'punyaku',created:Date.now()});closeM('mHutang');sync();}
async function saveTagihan(){var n=document.getElementById('tgNama').value.trim();var j=Number(document.getElementById('tgJml').value)||0;if(!n||!j){alert('Isi nama & jumlah');return;}await db.collection('tagihans').add({nama:n,jumlah:j,akun:currentAkun||'punyaku',created:Date.now()});closeM('mTagihan');sync();}
async function saveNabung(){var n=document.getElementById('nNama').value.trim();var t=Number(document.getElementById('nTarget').value)||0;if(!n||!t){alert('Isi nama & target');return;}await db.collection('nabungs').add({nama:n,target:t,terkumpul:Number(document.getElementById('nKumpul').value)||0,akun:currentAkun||'punyaku',created:Date.now()});closeM('mNabung');sync();}
function saveBudgetCat(){var n=document.getElementById('bCatNama').value.trim().toLowerCase();var j=Number(document.getElementById('bCatJml').value)||0;if(!n){alert('Isi nama');return;}alokasiData[n]=j;localStorage.setItem('alokasi_'+currentAkun,JSON.stringify(alokasiData));closeM('mBudget');renderAll();}
function savePersen(){persenData={tagihan:Number(document.getElementById('pTagihan').value)||0,hutang:Number(document.getElementById('pHutang').value)||0,nabung:Number(document.getElementById('pNabung').value)||0,budget:Number(document.getElementById('pBudget').value)||0};localStorage.setItem('analisis_persen_'+currentAkun,JSON.stringify(persenData));alert('Simpan %');renderKonsul();}
function renderAll(){var tot=0;for(var i=0;i<dompets.length;i++)tot+=Number(dompets[i].saldo||0);document.getElementById('total').innerText='Rp '+tot;var inM=0,outM=0;for(var i=0;i<transaksis.length;i++){if(transaksis[i].tipe=='masuk')inM+=Number(transaksis[i].jml);else outM+=Number(transaksis[i].jml);}document.getElementById('inM').innerText='Masuk '+inM;document.getElementById('outM').innerText='Keluar '+outM;document.getElementById('sisa').innerText='Sisa '+(inM-outM);var h='';for(var i=0;i<transaksis.length&&i<20;i++){var t=transaksis[i];h+='<div style="border-bottom:1px solid #eee;padding:6px 0"><b>'+t.kategori+' Rp '+t.jml+'</b> '+(t.link!='none'?'🔗'+t.link:'')+' '+t.catatan+' <button onclick="hapusTrx(\''+t.id+'\')" style="float:right">x</button></div>';}document.getElementById('listTrx').innerHTML=h||'Belum ada';var hd='';for(var i=0;i<dompets.length;i++){hd+='<div class="card"><b>'+dompets[i].nama+'</b> Rp '+dompets[i].saldo+' <button onclick="hapusDompet(\''+dompets[i].id+'\')" style="float:right">Hapus</button></div>';}document.getElementById('listDompet').innerHTML=hd;document.getElementById('totalHutang').innerText='Rp '+hutangs.reduce(function(a,b){return a+Number(b.total||0);},0);document.getElementById('totalTagihan').innerText='Rp '+tagihans.reduce(function(a,b){return a+Number(b.jumlah||0);},0);document.getElementById('totalNabung').innerText='Rp '+nabungs.reduce(function(a,b){return a+Number(b.terkumpul||0);},0);document.getElementById('totalBudget').innerText='Rp '+Object.values(alokasiData).reduce(function(a,b){return a+Number(b||0);},0);var hb='';for(var i=0;i<hutangs.length;i++){hb+='<div class="card">'+hutangs[i].nama+' Rp '+hutangs[i].total+'</div>';}document.getElementById('listHutang').innerHTML=hb;var tb='';for(var i=0;i<tagihans.length;i++){tb+='<div class="card">'+tagihans[i].nama+' Rp '+tagihans[i].jumlah+'</div>';}document.getElementById('listTagihan').innerHTML=tb;var nb='';for(var i=0;i<nabungs.length;i++){nb+='<div class="card">'+nabungs[i].nama+' '+nabungs[i].terkumpul+'/'+nabungs[i].target+'</div>';}document.getElementById('listNabung').innerHTML=nb;var bb='';var ks=Object.keys(alokasiData);for(var i=0;i<ks.length;i++){bb+='<div class="card">'+ks[i]+' Rp '+alokasiData[ks[i]]+'</div>';}document.getElementById('listBudget').innerHTML=bb;updDom();}
function renderAnalisis(){try{var inM=0,outM=0,kat={};for(var i=0;i<transaksis.length;i++){if(transaksis[i].tipe=='masuk')inM+=Number(transaksis[i].jml);if(transaksis[i].tipe=='keluar'){outM+=Number(transaksis[i].jml);kat[transaksis[i].kategori]=(kat[transaksis[i].kategori]||0)+Number(transaksis[i].jml);}}var c1e=document.getElementById('c1');if(c1e){if(c1){try{c1.destroy();}catch(e){}}c1=new Chart(c1e,{type:'doughnut',data:{labels:['Masuk','Keluar'],datasets:[{data:[inM||1,outM||1]}]}});}var c2e=document.getElementById('c2');if(c2e){var labs=Object.keys(kat);var vals=[];for(var k=0;k<labs.length;k++){vals.push(kat[labs[k]]);}if(labs.length==0){labs=['Belum'];vals=[1];}if(c2){try{c2.destroy();}catch(e){}}c2=new Chart(c2e,{type:'pie',data:{labels:labs,datasets:[{data:vals}]}});}document.getElementById('ringAnalisis').innerText='Income '+inM+' Keluar '+outM;}catch(e){document.getElementById('ringAnalisis').innerText='Chart error: '+e.message;}}
function renderKonsul(){try{var totT=0,totH=0;for(var i=0;i<tagihans.length;i++)totT+=Number(tagihans[i].jumlah||0);for(var i=0;i<hutangs.length;i++)totH+=Number(hutangs[i].cicilan||0);var inM=0;for(var i=0;i<transaksis.length;i++)if(transaksis[i].tipe=='masuk')inM+=Number(transaksis[i].jml);var rt=inM||1;document.getElementById('rTagihan').innerText=(totT/rt*100).toFixed(1)+'%';document.getElementById('rHutang').innerText=(totH/rt*100).toFixed(1)+'%';document.getElementById('konsulRing').innerText='Sisa '+(inM-totT-totH);var ctx=document.getElementById('cK');if(ctx){if(cK){try{cK.destroy();}catch(e){}}cK=new Chart(ctx,{type:'pie',data:{labels:['Tagihan','Hutang','Sisa'],datasets:[{data:[totT,totH,Math.max(0,inM-totT-totH)]}]}});}}catch(e){}var hb='';for(var i=0;i<pembelians.length;i++){hb+='<div class="card">'+pembelians[i].nama+' Rp '+pembelians[i].harga+' Lvl '+pembelians[i].level+'</div>';}document.getElementById('listBeli').innerHTML=hb;}
function tanyaBeli(){var n=document.getElementById('bNama').value;var h=Number(document.getElementById('bHarga').value)||0;var a=document.getElementById('bAlasan').value;if(!n||!h){alert('Isi nama & harga');return;}var lvl=h>1000000?'🔴 5 BUTUH BANGET':h>500000?'🟡 3 PERLU':'🔵 2 INGIN';document.getElementById('bLevel').innerText=lvl;document.getElementById('bSaran').style.display='block';document.getElementById('bSaran').innerText=n+' Rp '+h+' => '+lvl+' Alasan:'+a;lastTanya={nama:n,harga:h,level:lvl};}
async function saveBeli(){if(!lastTanya){alert('Tanya dulu');return;}await db.collection('pembelians').add({nama:lastTanya.nama,harga:lastTanya.harga,level:lastTanya.level,akun:currentAkun||'punyaku',created:Date.now()});alert('✅ Simpan beli');renderKonsul();sync();}
async function hapusDompet(id){if(!confirm('Hapus dompet?'))return;await db.collection('dompets').doc(id).delete();sync();}
async function hapusTrx(id){if(!confirm('Hapus transaksi?'))return;await db.collection('transaksis').doc(id).delete();sync();}
async function hapusHutang(id){if(!confirm('Hapus hutang?'))return;await db.collection('hutangs').doc(id).delete();sync();}
async function hapusTagihan(id){if(!confirm('Hapus tagihan?'))return;await db.collection('tagihans').doc(id).delete();sync();}
async function hapusNabung(id){if(!confirm('Hapus nabung?'))return;await db.collection('nabungs').doc(id).delete();sync();}
async function hapusBeli(id){if(!confirm('Hapus beli?'))return;await db.collection('pembelians').doc(id).delete();sync();}
function hapusBudgetCat(k){delete alokasiData[k];localStorage.setItem('alokasi_'+currentAkun,JSON.stringify(alokasiData));renderAll();}
function simpanBudget(){localStorage.setItem('alokasi_'+currentAkun,JSON.stringify(alokasiData));alert('✅ Budget disimpan');}
function updateLabel(){var b=bulanAktif;var el=document.getElementById('bulanLabel');if(el)el.innerText=b.toLocaleDateString('id-ID',{month:'long',year:'numeric'});var am=document.getElementById('modeLabel');if(am)am.innerText=analisisMode;}
function setMode(m){analisisMode=m;document.getElementById('bulanPicker').value='';updateLabel();renderAnalisis();renderAll();}
function gantiBulan(){var v=document.getElementById('bulanPicker').value;if(!v){setMode('all');return;}var sp=v.split('-');bulanAktif=new Date(Number(sp[0]),Number(sp[1])-1,1);analisisMode='bulan';updateLabel();renderAll();renderAnalisis();}
function renderAnalisis(){try{var inM=0,outM=0,kat={};for(var i=0;i<transaksis.length;i++){if(transaksis[i].tipe=='masuk')inM+=Number(transaksis[i].jml);if(transaksis[i].tipe=='keluar'){outM+=Number(transaksis[i].jml);kat[transaksis[i].kategori]=(kat[transaksis[i].kategori]||0)+Number(transaksis[i].jml);}}var c1e=document.getElementById('c1');if(c1e){if(c1){try{c1.destroy();}catch(e){}}c1=new Chart(c1e,{type:'doughnut',data:{labels:['Masuk','Keluar'],datasets:[{data:[inM,outM],backgroundColor:['#16a34a','#BE1E2D']}]},options:{responsive:true}});}var c2e=document.getElementById('c2');if(c2e){var labs=Object.keys(kat);var vals=[];for(var k=0;k<labs.length;k++){vals.push(kat[labs[k]]);}if(labs.length==0){labs=['Belum'];vals=[1];}if(c2){try{c2.destroy();}catch(e){}}c2=new Chart(c2e,{type:'pie',data:{labels:labs,datasets:[{data:vals,backgroundColor:['#facc15','#22c55e','#3b82f6','#a855f7','#ec4899']}]},options:{responsive:true}});}document.getElementById('ringAnalisis').innerText='Income '+inM+' Keluar '+outM+' Sisa '+(inM-outM);}catch(e){document.getElementById('ringAnalisis').innerText='Chart error: '+e.message;}}
function renderKonsul(){try{var totT=0,totH=0;for(var i=0;i<tagihans.length;i++)totT+=Number(tagihans[i].jumlah||0);for(var i=0;i<hutangs.length;i++)totH+=Number(hutangs[i].cicilan||0);var inM=0;for(var i=0;i<transaksis.length;i++)if(transaksis[i].tipe=='masuk')inM+=Number(transaksis[i].jml);var rt=inM||1;var rT=document.getElementById('rTagihan');if(rT)rT.innerText=(totT/rt*100).toFixed(1)+'%';var rH=document.getElementById('rHutang');if(rH)rH.innerText=(totH/rt*100).toFixed(1)+'%';document.getElementById('konsulRing').innerText='Sisa '+(inM-totT-totH)+' | Tagihan '+(totT/rt*100).toFixed(0)+'% Hutang '+(totH/rt*100).toFixed(0)+'%';var ctx=document.getElementById('cK');if(ctx){if(cK){try{cK.destroy();}catch(e){}}cK=new Chart(ctx,{type:'pie',data:{labels:['Tagihan','Hutang','Sisa'],datasets:[{data:[totT,totH,Math.max(0,inM-totT-totH)],backgroundColor:['#7c3aed','#dc2626','#22c55e']}]},options:{responsive:true}});}var hb='';for(var i=0;i<pembelians.length;i++){hb+='<div class="card"><b>'+pembelians[i].nama+' Rp '+pembelians[i].harga+'</b> Lvl '+pembelians[i].level+' <button onclick="hapusBeli(\''+pembelians[i].id+'\')" style="float:right">x</button></div>';}document.getElementById('listBeli').innerHTML=hb||'Belum ada beli';}catch(e){}}
if(currentAkun){document.getElementById('selId').value=currentAkun;document.getElementById('boxPass').style.display='block';document.getElementById('infoAkun').innerText=currentAkun;}
console.log('v30.3 FINAL loaded OK - modal + link + chart + tanya beli all working');
</script>
