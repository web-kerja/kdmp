function daftar(){var nama=document.getElementById('dfNama').value.trim();var p1=document.getElementById('dfPass').value;var p2=document.getElementById('dfPass2').value;if(!nama||p1.length<4){alert('Nama & pass min 4');return;}if(p1!=p2){alert('Pass beda');return;}var id=nama.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,10)+'_'+Date.now().toString().slice(-4);var custom=JSON.parse(localStorage.getItem('catatduit_custom_akun')||'[]');custom.push({id:id,nama:nama,pass:p1});localStorage.setItem('catatduit_custom_akun',JSON.stringify(custom));closeM('mDaftar');loadCustom();alert('Akun dibuat');}
function getKat(){var k=null;try{k=JSON.parse(localStorage.getItem('catat_kategori')||'null')}catch(e){}if(!k){var def={masuk:['Gaji','Bonus'],keluar:['Makan','Transport','Tagihan','Bayar Hutang','Nabung','Jajan','Bensin','Baju','Gadget','Modal']};localStorage.setItem('catat_kategori',JSON.stringify(def));return def;}return k;}
function updateKat(){var cats=getKat();var list=tipe=='masuk'?cats.masuk:cats.keluar;document.getElementById('tKategori').innerHTML=list.map(function(c){return `<option>${c}</option>`;}).join('');var opt=dompets.map(function(d){return `<option value="${d.id}">${d.nama} - Rp ${Number(d.saldo||0).toLocaleString('id-ID')}</option>`;}).join('')||'<option value="">Buat dompet</option>';document.getElementById('tDompet').innerHTML=opt;document.getElementById('tDompet2').innerHTML=opt;updLink();}
function updLink(){var link=document.getElementById('tLink').value;var tar=document.getElementById('tLinkTarget');if(link=='none'){tar.style.display='none';return;}tar.style.display='block';var html='';if(link=='budget'){html=Object.keys(alokasiData).map(function(c){return `<option value="${c}">${c.toUpperCase()}</option>`;}).join('')||'<option value="jajan">Jajan</option>';}else if(link=='nabung'){html=nabungs.map(function(n){return `<option value="${n.id}">${n.nama}</option>`;}).join('')||'<option value="">Belum ada</option>';}else if(link=='hutang'){html=hutangs.map(function(h){return `<option value="${h.id}">${h.nama}</option>`;}).join('')||'<option value="">Belum ada</option>';}tar.innerHTML=html;}
function setTipe(t){tipe=t;document.getElementById('btKeluar').style.background=(t=='keluar'?'#BE1E2D':'#eee');document.getElementById('btKeluar').style.color=(t=='keluar'?'#fff':'#000');document.getElementById('btMasuk').style.background=(t=='masuk'?'#16a34a':'#eee');document.getElementById('btMasuk').style.color=(t=='masuk'?'#fff':'#000');document.getElementById('btPindah').style.background=(t=='pindah'?'#2563eb':'#eee');document.getElementById('btPindah').style.color=(t=='pindah'?'#fff':'#000');document.getElementById('tDompet2').style.display=(t=='pindah'?'block':'none');updateKat();}
document.getElementById('tLink').addEventListener('change',updLink);
function hitungSkor(h){var s=0;s+=Number(h.bunga||0)*5;s+=Number(h.total||0)/1000000;if(h.jatuhTempo){var diff=Math.ceil((new Date(h.jatuhTempo)-new Date())/86400000);if(diff<7)s+=20;else if(diff<30)s+=10;}if(h.prioritasManual>0)s+=(6-Number(h.prioritasManual))*15;return Math.round(s);}
async function sync(){var akun=currentAkun||localStorage.getItem('catatduit_akun')||'punyaku';document.getElementById('syncInfo').innerText='⏳ Sync '+akun;document.getElementById('debug').innerText='Sync '+akun+'...';try{var sd=await db.collection('dompets').get();dompets=[];sd.forEach(function(d){var da=d.data();if(da.akun==akun)dompets.push({id:d.id,...da});});var st=await db.collection('transaksis').orderBy('created','desc').limit(100).get();transaksis=[];st.forEach(function(d){var da=d.data();if(da.akun==akun)transaksis.push({id:d.id,...da});});var sh=await db.collection('hutangs').get();hutangs=[];sh.forEach(function(d){var da=d.data();if(da.akun==akun)hutangs.push({id:d.id,...da,skor:hitungSkor(da)});});var stg=await db.collection('tagihans').get();tagihans=[];stg.forEach(function(d){var da=d.data();if(da.akun==akun)tagihans.push({id:d.id,...da});});var sn=await db.collection('nabungs').get();nabungs=[];sn.forEach(function(d){var da=d.data();if(da.akun==akun)nabungs.push({id:d.id,...da});});var sb=await db.collection('pembelians').orderBy('created','desc').limit(50).get();pembelians=[];sb.forEach(function(d){var da=d.data();if(da.akun==akun)pembelians.push({id:d.id,...da});});document.getElementById('syncInfo').innerText='✅ OK v30 '+dompets.length+'/'+transaksis.length;document.getElementById('debug').innerText=`v30 ULTRA KLIK OK\nAkun:${akun} Dompet:${dompets.length} Trx:${transaksis.length}\nKlik semua tombol sudah bisa`;renderAll();renderHutang();renderTagihan();renderNabung();renderBeli();renderBudget();}catch(e){document.getElementById('syncInfo').innerText='❌ Gagal';document.getElementById('debug').innerText='❌ '+e.message;}}
async function saveDompet(){var nama=document.getElementById('dNama').value.trim();var saldo=Number(document.getElementById('dSaldo').value)||0;if(!nama){alert('Isi nama');return;}var akun=currentAkun||'punyaku';await db.collection('dompets').add({nama:nama,saldo:saldo,akun:akun,created:Date.now()});closeM('mDompet');sync();}
async function saveTrx(){var jml=Number(document.getElementById('tJml').value)||0;var dom=document.getElementById('tDompet').value;var dom2=document.getElementById('tDompet2').value;if(!jml||!dom){alert('Isi jumlah & dompet');return;}var akun=currentAkun||'punyaku';var kat=document.getElementById('tKategori').value;var cat=document.getElementById('tCat').value;var tgl=document.getElementById('tTgl').value||new Date().toISOString().slice(0,10);var editId=document.getElementById('tId').value;var link=document.getElementById('tLink').value;var linkT=document.getElementById('tLinkTarget').value;var dRef=db.collection('dompets').doc(dom);var dSnap=await dRef.get();var dData=dSnap.data();if(!editId){if(tipe=='keluar')await dRef.update({saldo:Number(dData.saldo||0)-jml});if(tipe=='masuk')await dRef.update({saldo:Number(dData.saldo||0)+jml});if(tipe=='pindah'&&dom2){var d2Ref=db.collection('dompets').doc(dom2);var d2Snap=await d2Ref.get();var d2Data=d2Snap.data();await dRef.update({saldo:Number(dData.saldo||0)-jml});await d2Ref.update({saldo:Number(d2Data.saldo||0)+jml});}if(link=='nabung'&&linkT){var nRef=db.collection('nabungs').doc(linkT);var nS=await nRef.get();if(nS.exists)await nRef.update({terkumpul:Number(nS.data().terkumpul||0)+jml});}if(link=='hutang'&&linkT){var hRef=db.collection('hutangs').doc(linkT);var hS=await hRef.get();if(hS.exists)await hRef.update({total:Math.max(0,Number(hS.data().total||0)-jml)});}if(link=='budget'&&linkT){alokasiData[linkT]=Math.max(0,Number(alokasiData[linkT]||0)-jml);localStorage.setItem('alokasi_'+akun,JSON.stringify(alokasiData));}}var payload={jml:jml,tipe:tipe,dompetId:dom,dompetNama:dData.nama,dompetTujuanId:dom2||'',kategori:kat,catatan:cat,tgl:tgl,akun:akun,link:link,linkTarget:linkT,created:Date.now()};if(editId){await db.collection('transaksis').doc(editId).update({...payload,updated:Date.now()});}else{await db.collection('transaksis').add(payload);}closeM('mTrx');sync();}

function renderAll(){var total=dompets.reduce(function(s,d){return s+Number(d.saldo||0);},0);document.getElementById('total').innerText='Rp '+total.toLocaleString('id-ID');var inM=0,outM=0;transaksis.forEach(function(t){if(analisisMode=='all'){if(t.tipe=='masuk')inM+=Number(t.jml);if(t.tipe=='keluar')outM+=Number(t.jml);}else{var bl=bulanAktif.getMonth();var th=bulanAktif.getFullYear();var dt=new Date(t.tgl);if(dt.getMonth()==bl&&dt.getFullYear()==th){if(t.tipe=='masuk')inM+=Number(t.jml);if(t.tipe=='keluar')outM+=Number(t.jml);}}});document.getElementById('inM').innerText='Masuk '+inM.toLocaleString('id-ID');document.getElementById('outM').innerText='Keluar '+outM.toLocaleString('id-ID');document.getElementById('sisa').innerText='Sisa Rp '+(inM-outM).toLocaleString('id-ID');var html='';transaksis.slice(0,50).forEach(function(t){html+=`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:8px 0"><div><b style="font-size:12px">${t.tipe=='masuk'?'🟢':'🔴'} ${t.kategori} Rp ${Number(t.jml).toLocaleString('id-ID')}</b><br><span style="font-size:10px;color:#888">${t.catatan||''} ${t.tgl}</span></div><div><button onclick="editTrx('${t.id}')" style="padding:6px 10px;border-radius:99px;background:#dbeafe;border:0">✏️</button> <button onclick="hapusTrx('${t.id}')" style="padding:6px 10px;border-radius:99px;background:#eee;border:0">✕</button></div></div>`;});document.getElementById('listTrx').innerHTML=html||'Belum ada';var htmlD='';dompets.slice().sort(function(a,b){return Number(b.saldo)-Number(a.saldo);}).forEach(function(d){htmlD+=`<div style="display:flex;justify-content:space-between;border:1px solid #eee;padding:10px;border-radius:12px;margin-top:6px"><div><b>${d.nama}</b><br>Rp ${Number(d.saldo||0).toLocaleString('id-ID')}</div><button onclick="hapusDompet('${d.id}')" style="padding:6px 12px;border-radius:99px;background:#fee2e2;border:0">Hapus</button></div>`;});document.getElementById('listDompet').innerHTML=htmlD||'Belum ada dompet';updateKat();renderBudget();}
function editTrx(id){var t=transaksis.find(function(x){return x.id==id;});if(!t)return;document.getElementById('tId').value=t.id;document.getElementById('tJml').value=t.jml;document.getElementById('tCat').value=t.catatan||'';document.getElementById('tTgl').value=t.tgl||'';tipe=t.tipe||'keluar';setTipe(tipe);document.getElementById('tLink').value=t.link||'none';setTimeout(function(){document.getElementById('tDompet').value=t.dompetId||'';document.getElementById('tKategori').value=t.kategori||'';updLink();if(t.linkTarget)document.getElementById('tLinkTarget').value=t.linkTarget;},150);document.getElementById('mTrx').classList.add('show');}
function renderHutang(){var tot=hutangs.reduce(function(a,b){return a+Number(b.total||0);},0);var per=hutangs.reduce(function(a,b){return a+Number(b.cicilan||0)+Number(b.admin||0);},0);document.getElementById('totalHutang').innerText='Rp '+tot.toLocaleString('id-ID');document.getElementById('angsuran').innerText='Angsuran Rp '+per.toLocaleString('id-ID');var html='';hutangs.slice().sort(function(a,b){return b.skor-a.skor;}).forEach(function(h){html+=`<div class="card" style="border-left:6px solid ${Number(h.skor)>20?'#dc2626':'#16a34a'}"><div style="display:flex;justify-content:space-between"><div><b>${h.nama} - Rp ${(Number(h.cicilan||0)+Number(h.admin||0)).toLocaleString('id-ID')}/bln Skor ${h.skor}</b><br><span style="font-size:10px">Sisa Rp ${Number(h.total).toLocaleString('id-ID')}</span></div><div><button onclick="editHutang('${h.id}')" style="padding:6px 10px;border-radius:99px;background:#3b82f6;color:#fff;border:0">✏️</button> <button onclick="hapusHutang('${h.id}')" style="padding:6px 10px;border-radius:99px;background:#dc2626;color:#fff;border:0">🗑️</button></div></div></div>`;});document.getElementById('listHutang').innerHTML=html||'Belum ada';}
function renderTagihan(){var tot=tagihans.reduce(function(a,b){return a+Number(b.jumlah||0);},0);document.getElementById('totalTagihan').innerText='Rp '+tot.toLocaleString('id-ID');var html='';tagihans.forEach(function(t){html+=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${t.nama} Rp ${Number(t.jumlah).toLocaleString('id-ID')}</b><div><button onclick="editTagihan('${t.id}')" style="padding:6px 10px;border-radius:99px;background:#3b82f6;color:#fff;border:0">✏️</button> <button onclick="hapusTagihan('${t.id}')" style="padding:6px 10px;border-radius:99px;background:#dc2626;color:#fff;border:0">🗑️</button></div></div></div>`;});document.getElementById('listTagihan').innerHTML=html||'Belum ada';}
function renderNabung(){var terk=nabungs.reduce(function(a,b){return a+Number(b.terkumpul||0);},0);var targ=nabungs.reduce(function(a,b){return a+Number(b.target||0);},0);document.getElementById('totalNabung').innerText='Rp '+terk.toLocaleString('id-ID')+' / Rp '+targ.toLocaleString('id-ID');var html='';nabungs.forEach(function(n){var p=Math.round(Number(n.terkumpul||0)/Number(n.target||1)*100);html+=`<div class="card"><div style="display:flex;justify-content:space-between"><div><b>${n.nama} ${p}%</b><br>Rp ${Number(n.terkumpul||0).toLocaleString('id-ID')} / Rp ${Number(n.target||0).toLocaleString('id-ID')}</div><div><button onclick="editNabung('${n.id}')" style="padding:6px 10px;border-radius:99px;background:#3b82f6;color:#fff;border:0">✏️</button> <button onclick="hapusNabung('${n.id}')" style="padding:6px 10px;border-radius:99px;background:#dc2626;color:#fff;border:0">🗑️</button></div></div></div>`;});document.getElementById('listNabung').innerHTML=html||'Belum ada';}
function renderBudget(){var inM=0;transaksis.forEach(function(t){if(t.tipe=='masuk')inM+=Number(t.jml);});var totTag=tagihans.reduce(function(a,b){return a+Number(b.jumlah||0);},0);var totHut=hutangs.reduce(function(a,b){return a+Number(b.cicilan||0)+Number(b.admin||0);},0);var sisa=Math.max(0,inM-totTag-totHut-Math.round(inM*0.2));document.getElementById('alokasiIncome').innerText='Inc Rp '+inM.toLocaleString('id-ID');document.getElementById('alokasiSisa').innerText='Sisa Rp '+sisa.toLocaleString('id-ID');var html='';Object.keys(alokasiData).forEach(function(cat){var val=Number(alokasiData[cat]||0);var persen=sisa>0?Math.round(val/sisa*100):0;html+=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${cat.toUpperCase()} ${val>0?'✅':'⚪'}</b><span>Rp ${val.toLocaleString('id-ID')} ${persen}%</span></div><div style="display:flex;gap:8px;margin-top:8px"><input type="range" min="0" max="100" value="${persen}" oninput="updBudgetRange('${cat}',this.value,${sisa})" style="flex:1"><input type="number" value="${val}" onchange="updBudgetRp('${cat}',this.value)" style="width:110px" class="input"></div><button onclick="hapusBudgetCat('${cat}')" style="padding:4px 10px;border-radius:99px;background:#fee2e2;border:0;margin-top:6px">Hapus ${cat}</button></div>`;});document.getElementById('listBudget').innerHTML=html||'Belum ada budget - klik + Kategori (fix tidak nutup)';document.getElementById('totalBudget').innerText='Total Rp '+Object.values(alokasiData).reduce(function(a,b){return a+Number(b||0);},0).toLocaleString('id-ID');}
function updBudgetRange(cat,persen,sisa){var rp=Math.round(sisa*Number(persen)/100);alokasiData[cat]=rp;localStorage.setItem('alokasi_'+currentAkun,JSON.stringify(alokasiData));document.getElementById('totalBudget').innerText='Total Rp '+Object.values(alokasiData).reduce(function(a,b){return a+Number(b||0);},0).toLocaleString('id-ID');}

ch(e){}}renderBeli();}
function savePersen(){persenData={tagihan:Number(document.getElementById('pTagihan').value)||0,hutang:Number(document.getElementById('pHutang').value)||0,nabung:Number(document.getElementById('pNabung').value)||0,budget:Number(document.getElementById('pBudget').value)||0};localStorage.setItem('analisis_persen_'+currentAkun,JSON.stringify(persenData));alert('% disimpan');renderKonsul();}
function tentukanLevel(nama,harga,alasan,kat,sisa){var text=(nama+' '+alasan).toLowerCase();var skor=3;var reason=[];if(text.match(/rusak|mati|hilang|darurat|butuh banget|kerja|sekolah|anak|sakit|obat|bayar|kontrak|kos|listrik|air|bensin habis|modal usaha|harus/)){skor=5;reason.push("Darurat");}else if(text.match(/penting|wajib|tagihan|hutang|nabung|investasi|kuliah|ujian|rapat|client|perlu banget/)){skor=4;reason.push("Penting");}else if(text.match(/pengen|ingin|fomo|diskon|promo|lihat|keren|bagus|baru|gadget|jajan|nongkrong|game|skin|topup/)){skor=2;reason.push("Keinginan");}if(sisa<=0){skor=Math.min(skor,2);reason.push("Sisa minus");}else if(Number(harga)>sisa*0.7){skor=Math.min(skor,2);reason.push(">70% sisa");}if(['modal','bensin','tagihan'].includes(kat)&&skor<4){skor=4;reason.push("Kategori penting");}if(['jajan','gadget'].includes(kat)&&skor>3&&Number(harga)>sisa*0.3){skor=3;reason.push("Jajan mahal");}var final=Math.max(1,Math.min(5,skor));var label={5:"🔴 5 BUTUH BANGET",4:"🟠 4 PENTING",3:"🟡 3 PERLU",2:"🔵 2 INGIN",1:"⚪ 1 TIDAK PERLU"}[final];return {level:final,label:label,reason:reason.join(" • ")};}
function tanyaBeli(){var nama=document.getElementById('bNama').value.trim();var harga=Number(document.getElementById('bHarga').value)||0;var kategori=document.getElementById('bKategori').value;var alasan=document.getElementById('bAlasan').value.trim();if(!nama||!harga){alert('Isi nama & harga');return;}if(!alasan){alert('Isi alasan');return;}var inM=0,outM=0;transaksis.forEach(function(t){if(t.tipe=='masuk')inM+=Number(t.jml);if(t.tipe=='keluar')outM+=Number(t.jml);});var totTag=tagihans.reduce(function(a,b){return a+Number(b.jumlah||0);},0);var totHut=hutangs.reduce(function(a,b){return a+Number(b.cicilan||0)+Number(b.admin||0);},0);var sisa=inM-totTag-totHut-outM;var hasil=tentukanLevel(nama,harga,alasan,kategori,sisa);document.getElementById('bLevel').innerHTML=hasil.label;var bs=document.getElementById('bSaran');bs.style.display='block';bs.innerHTML=`<b>${hasil.label}</b><br>${nama} Rp ${harga.toLocaleString('id-ID')}<br>📝 ${alasan}<br>🤖 ${hasil.reason}<br>💡 Sisa Rp ${sisa.toLocaleString('id-ID')}`;lastTanya={nama:nama,harga:harga,kategori:kategori,level:hasil.level,alasan:alasan,hasil:hasil,sisa:sisa,tgl:new Date().toISOString().slice(0,10)};}
async function saveBeli(){if(!lastTanya){alert('Klik TANYA dulu');return;}var d=lastTanya;var akun=currentAkun||'punyaku';await db.collection('pembelians').add({nama:d.nama,harga:d.harga,kategori:d.kategori,level:d.level,alasan:d.alasan,status:d.hasil.label,saran:d.hasil.reason,sisa:d.sisa,tgl:d.tgl,akun:akun,created:Date.now()});alert('Simpan level '+d.level);lastTanya=null;document.getElementById('bSaran').style.display='none';document.getElementById('bNama').value='';document.getElementById('bHarga').value='';document.getElementById('bAlasan').value='';sync();}
function renderBeli(){var html='';pembelians.forEach(function(b){html+=`<div class="card" style="border-left:4px solid ${Number(b.level)>=4?'#dc2626':'#ddd'}"><b>${b.nama} Rp ${Number(b.harga).toLocaleString('id-ID')} Lvl ${b.level}</b><br><span style="font-size:10px">${b.status||''} 📝 ${b.alasan||''}</span><br><button onclick="hapusBeli('${b.id}')" style="padding:4px 10px;border-radius:99px;background:#fee2e2;border:0;margin-top:4px">Hapus</button></div>`;});document.getElementById('listBeli').innerHTML=html||'Belum ada';}
async function hapusBeli(id){if(!confirm('Hapus?'))return;await db.collection('pembelians').doc(id).delete();sync();}
async function clearBeli(){if(!confirm('Hapus semua?'))return;for(var i=0;i<pembelians.length;i++){await db.collection('pembelians').doc(pembelians[i].id).delete();}sync();}
function editHutang(id){var h=hutangs.find(function(x){return x.id==id;});if(!h)return;document.getElementById('hId').value=h.id;document.getElementById('hNama').value=h.nama||'';document.getElementById('hTotal').value=h.total||'';document.getElementById('hCicilan').value=h.cicilan||'';document.getElementById('hAdmin').value=h.admin||'';document.getElementById('hTenor').value=h.tenor||'';document.getElementById('hBunga').value=h.bunga||'';document.getElementById('hPrioritas').value=h.prioritasManual||'0';document.getElementById('hJatuh').value=h.jatuhTempo||'';document.getElementById('hAlasan').value=h.alasan||'';document.getElementById('mHutang').classList.add('show');}
async function saveHutang(){var id=document.getElementById('hId').value;var nama=document.getElementById('hNama').value.trim();var total=Number(document.getElementById('hTotal').value)||0;var cic=Number(document.getElementById('hCicilan').value)||0;if(!nama||!total||!cic){alert('Isi nama/total/cicilan');return;}var akun=currentAkun||'punyaku';var payload={nama:nama,total:total,tenor:Number(document.getElementById('hTenor').value)||12,cicilan:cic,admin:Number(document.getElementById('hAdmin').value)||0,bunga:Number(document.getElementById('hBunga').value)||0,prioritasManual:document.getElementById('hPrioritas').value,jatuhTempo:document.getElementById('hJatuh').value,alasan:document.getElementById('hAlasan').value,akun:akun,created:Date.now(),skor:hitungSkor({total:total,bunga:Number(document.getElementById('hBunga').value)||0,jatuhTempo:document.getElementById('hJatuh').value,prioritasManual:document.getElementById('hPrioritas').value})};if(id)await db.collection('hutangs').doc(id).set(payload,{merge:true});else await db.collection('hutangs').add(payload);closeM('mHutang');sync();}
async function hapusHutang(id){if(!confirm('Hapus?'))return;await db.collection('hutangs').doc(id).delete();sync();}
function editTagihan(id){var t=tagihans.find(function(x){return x.id==id;});if(!t)return;document.getElementById('tgId').value=t.id;document.getElementById('tgNama').value=t.nama||'';document.getElementById('tgJml').value=t.jumlah||'';document.getElementById('tgTgl').value=t.tanggal||'';document.getElementById('tgJatuh').value=t.jatuhTempo||'';document.getElementById('mTagihan').classList.add('show');}
async function saveTagihan(){var id=document.getElementById('tgId').value;var nama=document.getElementById('tgNama').value.trim();var jml=Number(document.getElementById('tgJml').value)||0;if(!nama||!jml){alert('Isi nama & jml');return;}var akun=currentAkun||'punyaku';var payload={nama:nama,jumlah:jml,tanggal:Number(document.getElementById('tgTgl').value)||1,jatuhTempo:document.getElementById('tgJatuh').value,akun:akun,created:Date.now()};if(id)await db.collection('tagihans').doc(id).set(payload,{merge:true});else await db.collection('tagihans').add(payload);closeM('mTagihan');sync();}

function editNabung(id){var n=nabungs.find(function(x){return x.id==id;});if(!n)return;document.getElementById('nId').value=n.id;document.getElementById('nNama').value=n.nama||'';document.getElementById('nTarget').value=n.target||'';document.getElementById('nKumpul').value=n.terkumpul||'';document.getElementById('nJatuh').value=n.jatuhTempo||'';document.getElementById('nAlasan').value=n.alasan||'';document.getElementById('mNabung').classList.add('show');}
async function saveNabung(){var id=document.getElementById('nId').value;var nama=document.getElementById('nNama').value.trim();var target=Number(document.getElementById('nTarget').value)||0;if(!nama||!target){alert('Isi nama & target');return;}var akun=currentAkun||'punyaku';var payload={nama:nama,target:target,terkumpul:Number(document.getElementById('nKumpul').value)||0,jatuhTempo:document.getElementById('nJatuh').value,alasan:document.getElementById('nAlasan').value,akun:akun,created:Date.now()};if(id)await db.collection('nabungs').doc(id).set(payload,{merge:true});else await db.collection('nabungs').add(payload);closeM('mNabung');sync();}

if(currentAkun){document.getElementById('selId').value=currentAkun;document.getElementById('boxPass').style.display='block';document.getElementById('infoAkun').innerText=currentAkun+' - masukkan pass lalu klik MASUK';}
updateLabel();
