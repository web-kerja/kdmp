<div id="mNabung" class="modal"><div style="background:#fff;border-radius:20px;padding:20px;width:100%;max-width:350px"><b>Nabung</b><input id="nNama" placeholder="Nama" class="input"><input id="nTarget" type="number" placeholder="Target" class="input"><input id="nKumpul" type="number" placeholder="Terkumpul" class="input"><input id="nId" type="hidden"><button onclick="saveNabung()" style="width:100%;padding:12px;border-radius:99px;background:#059669;color:#fff;border:0;font-weight:900;margin-top:10px">SIMPAN</button><button onclick="closeM('mNabung')" style="width:100%;padding:10px;border-radius:99px;background:#eee;border:0;margin-top:8px">Batal</button></div></div>

<script>
document.getElementById('jsStatus').innerText='✅ JS jalan - '+new Date().toLocaleTimeString();
document.getElementById('jsStatus').style.color='green';

var firebaseConfig={apiKey:"AIzaSyA93AVYbEp3ocRCQEtrh0v7_9I5cpJKHiI",authDomain:"catatduit-55060.firebaseapp.com",projectId:"catatduit-55060",storageBucket:"catatduit-55060.firebasestorage.app",messagingSenderId:"1025155283832",appId:"1:1025155283832:web:ee5b46a39942357700e68d"};
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
var db=firebase.firestore();
var currentAkun=localStorage.getItem('catatduit_akun')||'';
var dompets=[],transaksis=[],hutangs=[],tagihans=[],nabungs=[],pembelians=[];
var alokasiData={};var tipe='keluar';var lastTanya=null;

function klikPunyaku(){document.getElementById('selId').value='punyaku';document.getElementById('infoAkun').innerText='punyaku';document.getElementById('boxPass').style.display='block';}
function klikKeluarga(){document.getElementById('selId').value='keluarga';document.getElementById('infoAkun').innerText='keluarga';document.getElementById('boxPass').style.display='block';}
function login(){var id=document.getElementById('selId').value;var p=document.getElementById('pass').value;if(id=='punyaku'&&p!='112221'){alert('Pass salah, harus 112221');return;}if(id=='keluarga'&&p!='1234'){alert('Pass salah, harus 1234');return;}localStorage.setItem('catatduit_akun',id);masuk(id);}
function force(){localStorage.setItem('catatduit_akun','punyaku');masuk('punyaku');}
function masuk(id){currentAkun=id;document.getElementById('loginPage').style.display='none';document.getElementById('appPage').style.display='block';document.getElementById('badgeAkun').innerText=id;document.getElementById('tTgl').value=new Date().toISOString().slice(0,10);try{alokasiData=JSON.parse(localStorage.getItem('alokasi_'+id)||'{}');}catch(e){alokasiData={}}sync();}
function logout(){localStorage.removeItem('catatduit_akun');location.reload();}
function closeM(id){document.getElementById(id).classList.remove('show');}
function testModal(){document.getElementById('mTest').classList.add('show');}
function bukaDompet(){console.log('bukaDompet klik');document.getElementById('mDompet').classList.add('show');}
function bukaTrx(){document.getElementById('tId').value='';document.getElementById('tJml').value='';updateDompetSelect();document.getElementById('mTrx').classList.add('show');}
function bukaHutang(){document.getElementById('hId').value='';document.getElementById('mHutang').classList.add('show');}
function bukaTagihan(){document.getElementById('tgId').value='';document.getElementById('mTagihan').classList.add('show');}
function bukaNabung(){document.getElementById('nId').value='';document.getElementById('mNabung').classList.add('show');}
function bukaBudget(){document.getElementById('mBudget').classList.add('show');}
function pindahTab(t){var tabs=['keuangan','hutang','tagihan','budget','nabung','konsul'];for(var i=0;i<tabs.length;i++){var el=document.getElementById('tab-'+tabs[i]);if(el)el.style.display=(tabs[i]==t?'block':'none');}}
function setTipe(t){tipe=t;document.getElementById('btKeluar').style.background=(t=='keluar'?'#BE1E2D':'#eee');document.getElementById('btMasuk').style.background=(t=='masuk'?'#16a34a':'#eee');}
function updateDompetSelect(){var opt=dompets.map(function(d){return '<option value="'+d.id+'">'+d.nama+' - '+d.saldo+'</option>';}).join('')||'<option value="">Buat dompet dulu</option>';document.getElementById('tDompet').innerHTML=opt;}

async function sync(){
var akun=currentAkun||localStorage.getItem('catatduit_akun')||'punyaku';
document.getElementById('syncInfo').innerText='⏳ '+akun;
document.getElementById('debug').innerText='Sync akun '+akun+'...';
try{
var sd=await db.collection('dompets').get();dompets=[];sd.forEach(function(d){var da=d.data();if(da.akun==akun)dompets.push({id:d.id, ...da});});
var st=await db.collection('transaksis').orderBy('created','desc').limit(100).get();transaksis=[];st.forEach(function(d){var da=d.data();if(da.akun==akun)transaksis.push({id:d.id, ...da});});
var sh=await db.collection('hutangs').get();hutangs=[];sh.forEach(function(d){var da=d.data();if(da.akun==akun)hutangs.push({id:d.id, ...da});});
var stg=await db.collection('tagihans').get();tagihans=[];stg.forEach(function(d){var da=d.data();if(da.akun==akun)tagihans.push({id:d.id, ...da});});
var sn=await db.collection('nabungs').get();nabungs=[];sn.forEach(function(d){var da=d.data();if(da.akun==akun)nabungs.push({id:d.id, ...da});});
var sb=await db.collection('pembelians').get();pembelians=[];sb.forEach(function(d){var da=d.data();if(da.akun==akun)pembelians.push({id:d.id, ...da});});
document.getElementById('syncInfo').innerText='✅ '+dompets.length+'/'+transaksis.length;
document.getElementById('debug').innerText='✅ OK\nAkun:'+akun+'\nDompet:'+dompets.length+'\nTrx:'+transaksis.length+'\nHutang:'+hutangs.length+'\n\nKalau modal test bisa kebuka = FIX';
renderAll();
}catch(e){
document.getElementById('syncInfo').innerText='❌ Gagal';
document.getElementById('debug').innerText='❌ Error sync: '+e.message;
alert('Sync error: '+e.message);
}
}

async function saveDompet(){var nama=document.getElementById('dNama').value.trim();var saldo=Number(document.getElementById('dSaldo').value)||0;if(!nama){alert('Isi nama');return;}var akun=currentAkun||'punyaku';try{await db.collection('dompets').add({nama:nama,saldo:saldo,akun:akun,created:Date.now()});closeM('mDompet');document.getElementById('dNama').value='';document.getElementById('dSaldo').value='';alert('✅ Dompet disimpan');sync();}catch(e){alert('Gagal: '+e.message);}}
async function saveTrx(){var jml=Number(document.getElementById('tJml').value)||0;var dom=document.getElementById('tDompet').value;if(!jml||!dom){alert('Isi jumlah & dompet');return;}var akun=currentAkun||'punyaku';var kat=document.getElementById('tKategori').value;var cat=document.getElementById('tCat').value;var tgl=document.getElementById('tTgl').value||new Date().toISOString().slice(0,10);var editId=document.getElementById('tId').value;try{var dRef=db.collection('dompets').doc(dom);var dSnap=await dRef.get();var dData=dSnap.data();if(!editId){if(tipe=='keluar')await dRef.update({saldo:Number(dData.saldo||0)-jml});else await dRef.update({saldo:Number(dData.saldo||0)+jml});}var payload={jml:jml,tipe:tipe,dompetId:dom,dompetNama:dData.nama,kategori:kat,catatan:cat,tgl:tgl,akun:akun,created:Date.now()};if(editId)await db.collection('transaksis').doc(editId).update(payload);else await db.collection('transaksis').add(payload);closeM('mTrx');alert('✅ Transaksi disimpan');sync();}catch(e){alert('Gagal: '+e.message);}}
async function saveHutang(){var nama=document.getElementById('hNama').value.trim();var total=Number(document.getElementById('hTotal').value)||0;var cic=Number(document.getElementById('hCicilan').value)||0;if(!nama||!total){alert('Isi nama & total');return;}var akun=currentAkun||'punyaku';var id=document.getElementById('hId').value;var payload={nama:nama,total:total,cicilan:cic,akun:akun,created:Date.now()};try{if(id)await db.collection('hutangs').doc(id).set(payload,{merge:true});else await db.collection('hutangs').add(payload);closeM('mHutang');alert('✅ Hutang disimpan');sync();}catch(e){alert('Gagal: '+e.message);}}
async function saveTagihan(){var nama=document.getElementById('tgNama').value.trim();var jml=Number(document.getElementById('tgJml').value)||0;if(!nama||!jml){alert('Isi nama & jumlah');return;}var akun=currentAkun||'punyaku';var id=document.getElementById('tgId').value;var payload={nama:nama,jumlah:jml,akun:akun,created:Date.now()};try{if(id)await db.collection('tagihans').doc(id).set(payload,{merge:true});else await db.collection('tagihans').add(payload);closeM('mTagihan');alert('✅ Tagihan disimpan');sync();}catch(e){alert('Gagal: '+e.message);}}
async function saveNabung(){var nama=document.getElementById('nNama').value.trim();var target=Number(document.getElementById('nTarget').value)||0;var kumpul=Number(document.getElementById('nKumpul').value)||0;if(!nama||!target){alert('Isi nama & target');return;}var akun=currentAkun||'punyaku';var id=document.getElementById('nId').value;var payload={nama:nama,target:target,terkumpul:kumpul,akun:akun,created:Date.now()};try{if(id)await db.collection('nabungs').doc(id).set(payload,{merge:true});else await db.collection('nabungs').add(payload);closeM('mNabung');alert('✅ Nabung disimpan');sync();}catch(e){alert('Gagal: '+e.message);}}
function saveBudgetCat(){var nama=document.getElementById('bCatNama').value.trim().toLowerCase();var jml=Number(document.getElementById('bCatJml').value)||0;if(!nama){alert('Isi nama');return;}alokasiData[nama]=jml;localStorage.setItem('alokasi_'+currentAkun,JSON.stringify(alokasiData));closeM('mBudget');renderAll();alert('✅ Budget '+nama+' disimpan');}
function renderAll(){
var total=dompets.reduce(function(s,d){return s+Number(d.saldo||0);},0);
document.getElementById('total').innerText='Rp '+total.toLocaleString('id-ID');
var inM=0,outM=0;transaksis.forEach(function(t){if(t.tipe=='masuk')inM+=Number(t.jml);else outM+=Number(t.jml);});
document.getElementById('inM').innerText='Masuk '+inM;document.getElementById('outM').innerText='Keluar '+outM;
document.getElementById('sisa').innerText='Sisa '+(inM-outM);
var html='';transaksis.slice(0,20).forEach(function(t){html+='<div style="border-bottom:1px solid #eee;padding:8px 0"><b>'+t.kategori+' Rp '+t.jml+'</b> '+t.catatan+' <button onclick="hapusTrx(\''+t.id+'\')" style="float:right">Hapus</button></div>';});
document.getElementById('listTrx').innerHTML=html||'Belum ada';
var htmlD='';dompets.forEach(function(d){htmlD+='<div style="border:1px solid #eee;padding:8px;border-radius:12px;margin-top:6px"><b>'+d.nama+'</b> Rp '+d.saldo+' <button onclick="hapusDompet(\''+d.id+'\')" style="float:right">Hapus</button></div>';});
document.getElementById('listDompet').innerHTML=htmlD||'Belum ada dompet';
document.getElementById('totalHutang').innerText='Rp '+hutangs.reduce(function(a,b){return a+Number(b.total||0);},0);
document.getElementById('totalTagihan').innerText='Rp '+tagihans.reduce(function(a,b){return a+Number(b.jumlah||0);},0);
document.getElementById('totalNabung').innerText='Rp '+nabungs.reduce(function(a,b){return a+Number(b.terkumpul||0);},0);
document.getElementById('totalBudget').innerText='Rp '+Object.values(alokasiData).reduce(function(a,b){return a+Number(b||0);},0);
var hb='';hutangs.forEach(function(h){hb+='<div class="card">'+h.nama+' Rp '+h.total+' <button onclick="hapusHutang(\''+h.id+'\')">Hapus</button></div>';});document.getElementById('listHutang').innerHTML=hb;
var tb='';tagihans.forEach(function(t){tb+='<div class="card">'+t.nama+' Rp '+t.jumlah+' <button onclick="hapusTagihan(\''+t.id+'\')">Hapus</button></div>';});document.getElementById('listTagihan').innerHTML=tb;
var nb='';nabungs.forEach(function(n){nb+='<div class="card">'+n.nama+' '+n.terkumpul+'/'+n.target+' <button onclick="hapusNabung(\''+n.id+'\')">Hapus</button></div>';});document.getElementById('listNabung').innerHTML=nb;
var bb='';Object.keys(alokasiData).forEach(function(k){bb+='<div class="card">'+k+' Rp '+alokasiData[k]+' <button onclick="hapusBudgetCat(\''+k+'\')">Hapus</button></div>';});document.getElementById('listBudget').innerHTML=bb;
updateDompetSelect();
}
