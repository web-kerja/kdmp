<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CatatDuit MERAH FIX PINDAH</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:#f5f5f5;color:#222}
.top{background:#e53935;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:20px} .top span{font-size:12px;background:#fff;color:#e53935;padding:4px 8px;border-radius:20px}
.wrap{padding:12px;max-width:480px;margin:auto}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.saldo-label{font-size:13px;color:#666} .saldo{font-size:32px;font-weight:800;margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap} button{border:0;border-radius:10px;padding:10px 12px;font-weight:700;cursor:pointer}
.btn-red{background:#e53935;color:#fff;flex:1} .btn-white{background:#eee;flex:1} .btn-green{background:#2e7d32;color:#fff;width:100%}
input,select{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:6px 0;font-size:15px}
label{font-size:12px;color:#666;font-weight:700}
#debug{background:#111;color:#0f0;padding:10px;border-radius:10px;font-size:12px;white-space:pre-wrap;min-height:40px}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#fff;display:flex;border-top:1px solid #ddd;max-width:480px;margin:auto}
.bottom button{flex:1;background:#fff;border-radius:0;padding:12px 0}
.bottom .active{color:#e53935;border-top:3px solid #e53935}
table{width:100%;font-size:13px;border-collapse:collapse} td,th{padding:8px;border-bottom:1px solid #eee;text-align:left}
</style>
</head>
<body>
<div class="top"><b>CatatDuit</b><span id="statusTop">Siap - Mode Lokal</span></div>
<div class="wrap" style="padding-bottom:80px">
  <div class="card">
    <div class="saldo-label">Saldo Saat Ini</div>
    <div class="saldo" id="saldoText">Rp 0</div>
    <div class="row">
      <button class="btn-red" onclick="setMode('keluar')">Keluar</button>
      <button class="btn-white" onclick="setMode('masuk')">Masuk</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="btn-white" onclick="alert('Akun: KDMP Bobotsari')">Akun</button>
      <button class="btn-white" onclick="alert('Transfer antar akun')">Transfer</button>
      <button class="btn-white" onclick="showRincian()">Rincian</button>
      <button class="btn-white" onclick="showSaldo()">Saldo</button>
    </div>
  </div>
  <div class="card">
    <label>Tanggal</label>
    <input type="date" id="tgl">
    <label>Kategori</label>
    <select id="kategori"><option>Penjualan</option><option>Belanja</option><option>Gaji</option><option>Operasional</option><option>Lainnya</option></select>
    <label>Jumlah (Rp)</label>
    <input type="number" id="jumlah" placeholder="0">
    <label>Keterangan</label>
    <input type="text" id="ket" placeholder="Contoh: Jual beras...">
    <button class="btn-green" onclick="simpan()">+ SIMPAN TRANSAKSI</button>
  </div>
  <div class="card"><b>Transaksi Terakhir</b><div id="list"></div></div>
  <div class="card"><b>DEBUG</b><div id="debug">mulai...</div></div>
</div>
<div class="bottom">
  <button class="active">Catat</button><button onclick="alert('Menu Akun')">Akun</button><button onclick="showRincian()">Laporan</button><button onclick="alert('Pengaturan')">Pengaturan</button>
</div>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script>
let db = null;
let mode = 'keluar';
let data = JSON.parse(localStorage.getItem('catatduit_data')||'[]');
const debugEl = document.getElementById('debug');
function log(m){ debugEl.textContent = m; console.log(m); }
function setMode(m){ mode = m; }
function formatRp(n){ return 'Rp ' + Number(n||0).toLocaleString('id-ID'); }
function norm(d){
  const jumlah = Number(d.jumlah ?? d.amount ?? d.nominal ?? d.value ?? 0);
  const m = String(d.mode ?? d.type ?? d.jenis ?? d.tipe ?? '').toLowerCase();
  const isMasuk = m.includes('masuk') || m.includes('in') || m==='income' || d.isIncome===true;
  return { tgl: d.tgl ?? d.date ?? d.tanggal ?? '', jumlah, ket: d.ket ?? d.keterangan ?? d.desc ?? d.description ?? '', kategori: d.kategori ?? d.category ?? '', mode: isMasuk ? 'masuk' : 'keluar', time: d.time ?? 0 };
}
function render(){
  let saldo = 0;
  data.forEach(raw=>{ const d = norm(raw); if(d.mode==='masuk') saldo+=d.jumlah; else saldo-=d.jumlah; });
  document.getElementById('saldoText').textContent = formatRp(saldo);
  let html = '<table><tr><th>Tgl</th><th>Ket</th><th>Jumlah</th></tr>';
  [...data].map(norm).reverse().slice(0,25).forEach(d=>{ html += '<tr><td>'+d.tgl+'</td><td>'+d.ket+' ('+d.kategori+')</td><td>'+formatRp(d.jumlah)+'</td></tr>'; });
  html += '</table>';
  document.getElementById('list').innerHTML = data.length ? html : 'Belum ada transaksi';
}
function simpan(){
  const tgl = document.getElementById('tgl').value || new Date().toISOString().slice(0,10);
  const jumlah = Number(document.getElementById('jumlah').value||0);
  const ket = document.getElementById('ket').value || document.getElementById('kategori').value;
  const kategori = document.getElementById('kategori').value;
  if(!jumlah){ alert('Isi jumlah dulu Mas'); return; }
  const item = {tgl, jumlah, ket, kategori, mode, time: Date.now()};
  data.push(item);
  localStorage.setItem('catatduit_data', JSON.stringify(data));
  if(db){ db.collection('transaksi').add(item).then(()=>log('sync OK tx='+data.length)).catch(e=>log('sync gagal: '+e.message)); }
  document.getElementById('jumlah').value=''; document.getElementById('ket').value='';
  render(); log('tersimpan lokal, total tx='+data.length);
}
function showRincian(){ alert('Total transaksi: '+data.length); render(); }
function showSaldo(){ render(); }
try{
  const firebaseConfig = {
    apiKey: "AIzaSyA93AVYbEp3ocRCQEtrh0v7_9I5cpJKHiI",
    authDomain: "catatduit-55060.firebaseapp.com",
    projectId: "catatduit-55060",
    storageBucket: "catatduit-55060.firebasestorage.app",
    messagingSenderId: "1025155283832",
    appId: "1:1025155283832:web:c89ea220aecbbb1200e68d",
    measurementId: "G-1HB989XJQ3"
  };
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  document.getElementById('statusTop').textContent = 'Siap - Online';
  log('login OK, coba sync...');
  db.collection('transaksi').orderBy('time','desc').limit(100).get().then(s=>{
    if(!s.empty){ data = []; s.forEach(doc=>data.push(doc.data())); localStorage.setItem('catatduit_data', JSON.stringify(data)); }
    render(); log('sync OK tx='+data.length);
  }).catch(e=>{ render(); log('sync gagal: '+e.message+' (pakai data lokal tx='+data.length+')'); });
}catch(e){ render(); log('Mode Lokal - '+e.message); }
document.getElementById('tgl').value = new Date().toISOString().slice(0,10);
render();
</script>
</body>
</html>
