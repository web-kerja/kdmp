<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catatan v31 catatduit</title><style>:root{--p:#2563eb;--bg:#f8fafc;--b:#e2e8f0}*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}body{background:var(--bg);padding-bottom:90px}header{position:sticky;top:0;z-index:10;background:linear-gradient(135deg,#2563eb,#1d4ed8);color:#fff;padding:16px 16px 20px;border-radius:0 0 20px 20px}h1{display:flex;justify-content:space-between;font-size:14px}.bal{font-size:32px;font-weight:800;margin:6px 0}#accName{background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px;font-size:13px}.card{background:#fff;margin:12px;border-radius:16px;padding:12px;box-shadow:0 2px 8px #0001;border:1px solid var(--b)}#walletList{display:flex;gap:8px;overflow:auto}.w{border:1px solid var(--b);padding:8px 12px;border-radius:12px;min-width:110px}.w b{display:block;font-size:13px}.w span{font-size:11px;opacity:.7}.tx{padding:10px 0;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;cursor:pointer}.fab{position:fixed;right:18px;bottom:18px;width:56px;height:56px;border-radius:50%;background:var(--p);color:#fff;font-size:32px;border:0;box-shadow:0 6px 18px #2563eb66}#empty{text-align:center;padding:30px 10px;opacity:.6}</style></head><body>
<header><h1><span id="accName" onclick="openAcc()">👤 Akun Saya</span><span id="on" style="font-size:11px">● Offline</span></h1><div class="bal" id="saldo">Rp 0</div><div style="font-size:12px;opacity:.8">Tap nama untuk ganti akun • Bebas nambah kamar</div></header>
<div class="card"><div style="display:flex;justify-content:space-between"><b>💳 Dompet</b><span style="font-size:12px;color:var(--p)" onclick="addWallet()">+ Tambah</span></div><div id="walletList"></div></div>
<div class="card"><b>📋 Transaksi</b><div id="list"></div><div id="empty" style="display:none"><p>Belum ada transaksi</p><button onclick="openSet()" style="background:var(--p);color:#fff;border:0;padding:10px 16px;border-radius:10px;margin-top:10px">🔗 Hubungkan ke HP Utama</button></div></div>
<button class="fab" onclick="openForm()">+</button>
<div id="mForm" style="display:none;position:fixed;inset:0;background:#0005;z-index:20;align-items:end"><div style="background:#fff;width:100%;border-radius:20px 20px 0 0;padding:16px"><h3 id="fTitle">Tambah</h3><input id="fCat" placeholder="Makan" style="width:100%;padding:12px;margin:8px 0;border:1px solid var(--b);border-radius:10px"><input id="fAmt" type="number" placeholder="50000" style="width:100%;padding:12px;margin:8px 0;border:1px solid var(--b);border-radius:10px"><select id="fWallet" style="width:100%;padding:12px;border:1px solid var(--b);border-radius:10px"></select><select id="fType" style="width:100%;padding:12px;margin:8px 0;border:1px solid var(--b);border-radius:10px"><option value="keluar">Keluar</option><option value="masuk">Masuk</option></select><div style="display:flex;gap:8px"><button onclick="saveTx()" style="flex:1;background:var(--p);color:#fff;padding:12px;border:0;border-radius:10px">Simpan</button><button onclick="closeForm()" style="flex:1;background:#f1f5f9;padding:12px;border:0;border-radius:10px">Batal</button></div><div id="fAct" style="display:none;margin-top:8px"><button onclick="delTx()" style="width:100%;background:#fee2e2;color:#dc2626;padding:12px;border:0;border-radius:10px">Hapus</button></div></div></div>
<div id="mSet" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:30;overflow:auto"><div style="background:#fff;padding:14px;position:sticky;top:0;display:flex;gap:10px;border-bottom:1px solid var(--b)"><button onclick="closeSet()" style="border:0;background:#f1f5f9;padding:8px 12px;border-radius:8px">←</button><b>⚙️ Pengaturan</b></div><div style="padding:12px">
<div class="card"><b>👥 Ganti Akun / Kamar - Bebas</b><div id="accList" style="margin-top:10px"></div><div style="display:flex;gap:8px;margin-top:10px"><input id="newAcc" placeholder="Warung, Usaha, Anak" style="flex:1;padding:10px;border:1px solid var(--b);border-radius:8px"><button onclick="createAcc()" style="background:var(--p);color:#fff;border:0;padding:10px 14px;border-radius:8px">+ Tambah</button></div></div>
<div class="card"><b>🔗 Hubungkan Perangkat</b><div style="font-size:12px;opacity:.7;margin:6px 0">Sinkron HP + Laptop kayak WA Web</div><div style="display:flex;gap:8px"><button onclick="showCode()" style="flex:1;background:#f1f5f9;padding:12px;border:0;border-radius:10px">Tampilkan Kode</button><button onclick="enterCode()" style="flex:1;background:var(--p);color:#fff;padding:12px;border:0;border-radius:10px">Masukkan Kode</button></div><div id="codeBox" style="display:none;margin-top:12px;text-align:center;background:#f8fafc;padding:16px;border-radius:12px;border:1px dashed var(--b)"><div style="font-size:12px">Kode Anda:</div><div id="myCode" style="font-size:28px;font-weight:800;letter-spacing:2px">------</div><div style="font-size:11px;opacity:.6">Berlaku 10 menit</div></div><div id="enterBox" style="display:none;margin-top:12px"><input id="inCode" placeholder="123456" style="width:100%;padding:12px;border:1px solid var(--b);border-radius:10px;text-align:center;font-size:20px;letter-spacing:3px"><button onclick="doConnect()" style="width:100%;margin-top:8px;background:var(--p);color:#fff;padding:12px;border:0;border-radius:10px">Hubungkan</button></div></div>
<div class="card"><b>💾 Data</b><div style="display:flex;gap:8px;margin-top:8px"><button onclick="exportJSON()" style="flex:1;background:#f1f5f9;padding:10px;border:0;border-radius:8px">Export JSON</button><button onclick="importOld()" style="flex:1;background:#f1f5f9;padding:10px;border:0;border-radius:8px">Import Lama</button></div><div style="font-size:11px;opacity:.6;margin-top:6px">ID: <span id="roomId">-</span> • <span id="fbStat">Menghubungkan...</span></div></div>
</div></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyA93AVYbEp3ocRCQEtrh0v7_9I5cpJKHiI",authDomain:"catatduit-55060.firebaseapp.com",projectId:"catatduit-55060",storageBucket:"catatduit-55060.firebasestorage.app",messagingSenderId:"1025155283832",appId:"1:1025155283832:web:c89ea220aecbbb1200e68d",measurementId:"G-1HB989XJQ3"};
firebase.initializeApp(firebaseConfig);const auth=firebase.auth(),db=firebase.firestore();
let uid=null,room=null,txs=[],wallets=[],editingId=null,accs=JSON.parse(localStorage.getItem('accs')||'[]'),curAcc=localStorage.getItem('curAcc')||'';
function saveAccs(){localStorage.setItem('accs',JSON.stringify(accs));localStorage.setItem('curAcc',curAcc)}
if(!accs.length){let id='room_'+Date.now();accs=[{id,name:'Akun Saya'}];curAcc=id;saveAccs()}room=curAcc;
function $(id){return document.getElementById(id)}function fmt(n){return 'Rp '+(n||0).toLocaleString('id-ID')}
auth.onAuthStateChanged(async u=>{if(!u){await auth.signInAnonymously();return}uid=u.uid;$('fbStat').innerText='Terhubung catatduit-55060';sync()});auth.signInAnonymously().catch(()=>{});
function roomRef(){return db.collection('rooms').doc(room)}function txRef(){return roomRef().collection('tx')}
async function sync(){if(!uid)return;txRef().orderBy('t','desc').onSnapshot(s=>{txs=[];s.forEach(d=>txs.push({id:d.id,...d.data()}));if(!txs.length){let old=JSON.parse(localStorage.getItem('oldTx')||localStorage.getItem('transactions')||'[]');if(old.length){txs=old;old.forEach(o=>txRef().add(o))}}render();localStorage.setItem('oldTx',JSON.stringify(txs))},e=>{let l=JSON.parse(localStorage.getItem('oldTx')||'[]');txs=l;render()});roomRef().collection('wallets').onSnapshot(s=>{wallets=[];s.forEach(d=>wallets.push({id:d.id,...d.data()}));if(!wallets.length){let uniq=[...new Set(txs.map(x=>x.wallet||'Cash'))];wallets=uniq.map(n=>({name:n}))}renderW()});$('on').innerText='● Online';$('on').style.color='#22c55e';updateRoom()}
function updateRoom(){$('roomId').innerText=room;$('accName').innerText=(accs.find(a=>a.id==room)?.name||'Akun Saya')}
function render(){let bal=0;txs.forEach(t=>{if(t.type=='masuk')bal+=+t.amount;else bal-=+t.amount});$('saldo').innerText=fmt(bal);let h='';if(!txs.length){$('empty').style.display='block'}else{$('empty').style.display='none';txs.forEach(t=>{h+=`<div class="tx" onclick="editTx('${t.id}')"><div><b>${t.cat}</b><div style="font-size:11px;opacity:.6">${t.wallet||''} • ${new Date(t.t||Date.now()).toLocaleDateString('id-ID')}</div></div><div style="color:${t.type=='masuk'?'#16a34a':'#dc2626'}">${t.type=='masuk'?'+':'-'}${fmt(t.amount)}</div></div>`})} $('list').innerHTML=h;renderW()}
function renderW(){let h='';wallets.forEach(w=>{let tot=0;txs.filter(t=>(t.wallet||'Cash')==w.name).forEach(t=>{tot+=t.type=='masuk'?+t.amount:-+t.amount});h+=`<div class="w" onclick="renameW('${w.name}')"><b>${w.name}</b><span>${fmt(tot)}</span></div>`});$('walletList').innerHTML=h||'<span style="font-size:12px;opacity:.5">Belum ada</span>';let o='';wallets.forEach(w=>{o+=`<option value="${w.name}">${w.name}</option>`});o+=`<option value="__new">+ Baru</option>`;$('fWallet').innerHTML=o}
function openForm(){editingId=null;$('fTitle').innerText='Tambah';$('fCat').value='';$('fAmt').value='';$('fAct').style.display='none';$('mForm').style.display='flex'}function closeForm(){$('mForm').style.display='none'}function openAcc(){openSet()}
function editTx(id){let t=txs.find(x=>x.id==id);if(!t)return;editingId=id;$('fTitle').innerText='Edit';$('fCat').value=t.cat;$('fAmt').value=t.amount;$('fWallet').value=t.wallet;$('fType').value=t.type;$('fAct').style.display='flex';$('mForm').style.display='flex'}
async function saveTx(){let cat=$('fCat').value||'Lain',amt=+($('fAmt').value||0),wal=$('fWallet').value,type=$('fType').value;if(wal=='__new'){wal=prompt('Nama dompet baru:','Cash');if(!wal)return;roomRef().collection('wallets').add({name:wal})}if(!amt)return alert('Isi jumlah');let d={cat,amount:amt,wallet:wal,type,t:Date.now()};if(editingId){await txRef().doc(editingId).set(d,{merge:true})}else{await txRef().add(d)}closeForm()}
async function delTx(){if(!editingId)return;if(!confirm('Hapus?'))return;await txRef().doc(editingId).delete();closeForm()}
function addWallet(){let n=prompt('Nama dompet:','BCA');if(!n)return;roomRef().collection('wallets').add({name:n})}
function renameW(old){let n=prompt('Rename/hapus (kosong=hapus): '+old,old);if(n===null)return;if(!n){if(confirm('Hapus '+old+'?')){roomRef().collection('wallets').where('name','==',old).get().then(s=>s.forEach(d=>d.ref.delete()))}return}roomRef().collection('wallets').where('name','==',old).get().then(s=>{if(s.empty)roomRef().collection('wallets').add({name:n});else s.forEach(d=>d.ref.update({name:n}))});txs.filter(t=>t.wallet==old).forEach(t=>txRef().doc(t.id).update({wallet:n}))}
function openSet(){renderAcc();$('mSet').style.display='block'}function closeSet(){$('mSet').style.display='none'}
function renderAcc(){let h='';accs.forEach(a=>{h+=`<div style="padding:10px;border:1px solid ${a.id==room?'#2563eb':'#e2e8f0'};border-radius:10px;margin-bottom:6px;display:flex;justify-content:space-between;background:${a.id==room?'#eff6ff':'#fff'}" onclick="switchAcc('${a.id}')"><span>${a.id==room?'🟢':''} ${a.name}</span><span style="font-size:11px;opacity:.6">${a.id.slice(-4)}</span></div>`});$('accList').innerHTML=h}
function switchAcc(id){curAcc=id;room=id;saveAccs();closeSet();sync()}function createAcc(){let n=$('newAcc').value.trim();if(!n)return alert('Isi nama');let id='room_'+Date.now();accs.push({id,name:n});curAcc=id;room=id;saveAccs();$('newAcc').value='';renderAcc();updateRoom();sync()}
function showCode(){let code=Math.floor(100000+Math.random()*900000).toString();$('myCode').innerText=code.slice(0,3)+'-'+code.slice(3);$('codeBox').style.display='block';$('enterBox').style.display='none';db.collection('codes').doc(code).set({room,exp:Date.now()+10*60*1000})}
function enterCode(){$('enterBox').style.display='block';$('codeBox').style.display='none'}
async function doConnect(){let co=$('inCode').value.replace(/[^0-9]/g,'');if(co.length!=6)return alert('6 digit');let doc=await db.collection('codes').doc(co).get();if(!doc.exists)return alert('Salah/expired');let r=doc.data().room;if(Date.now()>doc.data().exp)return alert('Expired');if(!accs.find(a=>a.id==r)){let nm=prompt('Nama akun:','Terhubung')||'Terhubung';accs.push({id:r,name:nm})}curAcc=r;room=r;saveAccs();alert('Terhubung ke '+r);closeSet();sync()}
function exportJSON(){let b=new Blob([JSON.stringify({room,accs,txs,wallets},null,2)],{type:'application/json'});let u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='keuangan-'+room+'.json';a.click()}
function importOld(){let old=localStorage.getItem('transactions')||localStorage.getItem('oldTx');if(old){let arr=JSON.parse(old);arr.forEach(o=>txRef().add({...o,t:Date.now()}));alert('Import '+arr.length)}else alert('Tidak ada data lama')}
</script></body></html>
